// name を渡すと「上＝名前、下＝説明」の2行で出す（お守り）
function toast(t, name){
  const el = $('#toast');
  el.innerHTML = '';
  if (name){
    const n = document.createElement('div'); n.className = 'tn'; n.textContent = name;
    const d = document.createElement('div'); d.className = 'td'; d.textContent = t;
    el.append(n, d);
  } else el.textContent = t;
  wrapJP(el);
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');

function enterNode(n){
  run.at = n.id;
  run.path.push(n.id);
  run.floor++;
  const act = ACTS[run.act - 1];
  const { r, done } = rrng();
  let foe = null;
  if (n.type === 'fight'){
    // 序盤2戦は弱めの敵から
    const pool = run.floor <= 2 ? act.easy : act.normal;
    foe = r.pick(pool.filter(f => f !== run.lastFoe).length ? pool.filter(f => f !== run.lastFoe) : pool);
  }
  if (n.type === 'elite') foe = r.pick(act.elite);
  if (n.type === 'boss') foe = act.boss;
  done();
  if (foe){ run.lastFoe = foe; run.pending = { foe, kind:n.type }; run.battle = null; save(); startBattle(foe); return; }
  if (n.type === 'rest') return openRest();
  if (n.type === 'shop') return openShop();
  if (n.type === 'event') return openEvent();
  if (n.type === 'treasure'){
    const [id] = relicChoices(1, false);
    if (id) gainRelic(id);
    return chooser({ title:'宝箱', sub: id ? 'お守りを手に入れた！' : '空っぽだった…',
      items: id ? [{ html:relicHTML(id), cls:'' }] : [], btn:{ label:'すすむ', on:enterMap } });
  }
}

/* ---------- 戦闘の後 ---------- */
function afterWin(){
  const kind = run.pending ? run.pending.kind : 'fight';
  run.pending = null;
  if (hasR('chishio')) heal(6);
  const base = kind === 'boss' ? 70 : kind === 'elite' ? 32 : 14;
  const { r, done } = rrng();
  const gold = Math.round((base + r.int(8)) * goldMul());
  done();
  run.gold += gold;
  const lines = [`銭 +${gold}`];
  let relic = null;
  if (kind === 'elite'){ [relic] = relicChoices(1, false); if (relic){ gainRelic(relic); lines.push(`お守り「${RELICS[relic].n}」`); } }
  const then = kind === 'boss' ? bossRelicPick : enterMap;
  const picks = cardChoices(3, kind);
  chooser({ title: kind === 'boss' ? '幕の主の落とし物' : '落とし物', sub: lines.join('　') + '<br>札を1組えらぶ',
    items: picks.map(k => ({ html:cardPickHTML(k, 0), cls:'rar' + SK[k].r, on:() => { run.deck.push({ k, u:0 }); then(); } })),
    btn:{ label:'いらない', on:then }, guard:true });
}
function bossRelicPick(){
  const ids = relicChoices(3, true);
  chooser({ title:'幕の主のお守り', sub:'1つえらぶ（強いが癖がある）',
    items: ids.map(id => ({ html:relicHTML(id), cls:'', on:() => { gainRelic(id); actClear(); } })),
    btn:{ label:'いらない', on:actClear } });
}
function actClear(){
  run.bosses++;
  if (run.act >= ACTS.length) return endRun(true);
  run.act++;
  run.map = genMap(run.act);
  run.at = -1;
  run.path = [];
  const h = Math.round(run.maxHp * 0.5);
  heal(h);
  save();
  chooser({ title:`第${run.act - 1}幕を越えた`, sub:`ひと息ついた。HP ${h} 回復<br>次は第${run.act}幕`, items:[], btn:{ label:'すすむ', on:enterMap } });
}
function gameOver(){ endRun(false); }

/* ---------- めくり熱 ----------
   タップの速さ・外しの多さ・最大連続・百鬼夜行の多さから、指の熱さ（℃）と称号を出す */
function mekuriHeat(S){
  const sec = Math.max(1, S.ms / 1000);
  const tps = S.taps / sec;
  const miss = S.misses / Math.max(1, S.taps);
  const fev = S.fevers / Math.max(1, S.battles);
  const pct = Math.max(1, Math.min(100, Math.round(
    Math.min(tps / 3.5, 1) * 45 + Math.min(miss / .5, 1) * 20 + Math.min(S.maxCombo / 25, 1) * 20 + Math.min(fev, 1) * 15)));
  const fast = tps >= 2.4, messy = miss >= .35, fv = fev >= .5;
  const T = {
    '111':['脳汁ジェットコースター','速い・雑・百鬼夜行の三拍子。指が燃えている'],
    '110':['連打の申し子','考えるより先に指が動いている'],
    '101':['瞬間記憶の百鬼使い','速くて正確。百鬼夜行を呼ぶ者'],
    '100':['瞬間記憶マシン','速いのに外さない。冷えた指先'],
    '011':['たまたま天才','ゆっくりめくって大当たりを引く'],
    '010':['のんびりガチャ勢','めくってみてから考えるタイプ'],
    '001':['じっくり大爆発型','溜めて溜めて百鬼夜行で解放'],
    '000':['慎重派の記憶術師','勢いより記憶。神経衰弱の正統派'],
  }[`${+fast}${+messy}${+fv}`];
  return { pct, deg: Math.round(35 + pct * 0.65), name:T[0], note:T[1], tps };
}

function endRun(win){
  const r = run;
  const S = r.stats;
  const score = r.floor * 10 + r.bosses * 100 + (win ? 500 : 0) + r.asc * 50;
  const d = loadSave();
  const meta = loadMeta();
  const before = unlockedCount(meta);
  meta.runs++;
  if (win){ meta.wins++; meta.maxAsc = Math.max(meta.maxAsc, Math.min(ASC.length - 1, r.asc + 1)); }
  const prevBest = meta.best;
  meta.best = Math.max(meta.best, score);
  meta.pts += r.floor + r.bosses * 10;
  const after = unlockedCount(meta);
  d.meta = meta;
  d.run = null;
  writeSave(d);
  run = null;
  applyUnlocks();
  const items = [];
  for (let i = before; i < after; i++){
    const [t, id] = UNLOCKS[i];
    items.push({ html: t === 'card' ? cardPickHTML(id, 0) : relicHTML(id), cls:'' });
  }
  const sec = Math.round(S.ms / 1000);
  const dg = mekuriHeat(S);
  // 結果：到達 → めくり熱（温度・称号・一言）→ 数字の表 → 解放、の順に縦に並べる
  const cell = (v, label, cls) => `<div class="rc${cls ? ' ' + cls : ''}"><b>${v}</b><span>${label}</span></div>`;
  const html = `
    <div class="res">
      <div class="res-reach">${win ? '三幕を越え、夜が明けた' : `第${r.act}幕 ${r.floor}階で力尽きた`}${r.asc ? `<em>闇${r.asc}</em>` : ''}</div>
      <div class="res-heat">
        <div class="hl">めくり熱</div>
        <div class="hd">${dg.deg}<small>℃</small></div>
        <div class="hn">${dg.name}</div>
        <div class="hx">${dg.note}</div>
        <div class="ht">毎秒 ${dg.tps.toFixed(1)} タップ</div>
      </div>
      <div class="res-grid">
        ${cell(score, '得点', score > prevBest ? 'best' : '')}${cell(meta.best, '最高得点')}${cell(S.matches, 'そろえた回数')}
        ${cell(S.maxCombo, '最大連続')}${cell(S.fevers, '百鬼夜行')}${cell(`${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`, '戦闘時間')}
      </div>
      ${win && meta.maxAsc > r.asc ? `<div class="res-note">闇${r.asc + 1} に挑めるようになった</div>` : ''}
      <div class="res-sec">${items.length ? '新しく解放' : (after < UNLOCKS.length ? `次の解放まで あと${UNLOCK_STEP - meta.pts % UNLOCK_STEP}` : 'すべて解放済み')}</div>
    </div>`;
  chooser({ title: win ? '夜明け' : '力尽きた…', sub: html, items, btn:{ label:'タイトルへ', on:enterTitle }, guard:!win });
}

/* ---------- 休憩 ---------- */
function openRest(){
  const h = Math.round(run.maxHp * (asc(5) ? 0.2 : 0.3));
  chooser({ title:'休憩所', sub:`HP ${run.hp}/${run.maxHp}`,
    items:[
      { html:`<div class="mini" style="--k:#4e7d3c">休</div><div><div class="nm">休む</div><div class="ds">HP ${h} 回復</div></div>`,
        on:() => { heal(h); enterMap(); } },
      { html:`<div class="mini" style="--k:#a8872e">鍛</div><div><div class="nm">鍛える</div><div class="ds">札を1組強化する（数字が大きくなる）</div></div>`,
        on:() => deckPicker('強化する札', e => !e.u && SK[e.k].r >= 0, e => { e.u = 1; enterMap(); toast(SK[e.k].d(1), `${SK[e.k].n}＋ になった`); }, openRest, true) },
    ] });
}
// 山札から1組えらぶ
function deckPicker(title, filter, onPick, onBack, upgrade){
  const items = [];
  const seen = new Set();
  run.deck.forEach(e => {
    const key = e.k + e.u;
    if (seen.has(key) || !filter(e)) return;
    seen.add(key);
    const cnt = run.deck.filter(x => x.k === e.k && x.u === e.u).length;
    items.push({ html:upgrade ? upgradePickHTML(e.k, cnt) : cardPickHTML(e.k, e.u, cnt), cls:'rar' + SK[e.k].r, on:() => onPick(e) });
  });
  chooser({ title, sub:upgrade ? '強化する札をえらぶ（同じ札の1組だけが強くなる）' : '札をえらぶ', items, btn:{ label:'もどる', on:onBack } });
}

/* ---------- 店 ---------- */
const PRICE = [48, 74, 120];
function priceMul(){ return (hasR('maneki') ? 0.8 : 1) * (asc(9) ? 1.1 : 1); }
function openShop(){
  if (!run.shop || run.shop.at !== run.at){
    const { r, done } = rrng();
    const cards = [];
    while (cards.length < 5){
      const rar = rollRarity(r, 'shop');
      const cand = POOL.filter(k => SK[k].r === rar && !cards.some(c => c.k === k));
      if (cand.length) cards.push({ k:r.pick(cand), sold:false });
    }
    cards.forEach(c => { c.p = Math.round(PRICE[SK[c.k].r] * (0.9 + r.next() * 0.2)); });
    done();
    const relics = relicChoices(2, false).map(id => ({ id, p:130 + run.act * 10 + (hashStr(id) % 40), sold:false }));
    run.shop = { at:run.at, cards, relics, removed:false };
  }
  renderShop();
}
function renderShop(){
  const sh = run.shop, pm = priceMul();
  const items = [];
  sh.cards.forEach(c => {
    const p = Math.round(c.p * pm);
    items.push({ html:cardPickHTML(c.k, 0) + `<span class="price">${c.sold ? '売切' : '銭' + p}</span>`, cls:'rar' + SK[c.k].r,
      disabled: c.sold || run.gold < p, on:() => { run.gold -= p; c.sold = true; run.deck.push({ k:c.k, u:0 }); save(); renderShop(); } });
  });
  sh.relics.forEach(x => {
    const p = Math.round(x.p * pm);
    items.push({ html:relicHTML(x.id) + `<span class="price">${x.sold ? '売切' : '銭' + p}</span>`,
      disabled: x.sold || run.gold < p, on:() => { run.gold -= p; x.sold = true; gainRelic(x.id); save(); renderShop(); } });
  });
  const rp = Math.round((60 + run.removes * 25) * pm);
  items.push({ html:`<div class="mini" style="--k:#3b3631">捨</div><div><div class="nm">札を1組捨てる</div><div class="ds">山札を軽くする（店ごとに1回）</div></div><span class="price">${sh.removed ? '済' : '銭' + rp}</span>`,
    disabled: sh.removed || run.gold < rp || run.deck.length <= 4,
    on:() => deckPicker('捨てる札', () => true, e => { run.deck.splice(run.deck.indexOf(e), 1); run.gold -= rp; run.removes++; sh.removed = true; save(); renderShop(); }, renderShop) });
  chooser({ title:'店', sub:`所持 銭${run.gold}`, items, btn:{ label:'店を出る', on:enterMap } });
}

/* ---------- できごと ---------- */
const EVENTS = [
  { t:'怪しい札売り', d:'「いい札があるよ…銭30でどうだい」',
    ch:[ ['銭30で買う', () => run.gold >= 30, () => { run.gold -= 30; const k = randCard(2); run.deck.push({ k, u:0 }); return `「${SK[k].n}」を1組手に入れた`; }],
         ['立ち去る', () => true, () => '何事もなかった'] ] },
  { t:'古い祠', d:'苔むした祠。血を捧げれば加護があるという。',
    ch:[ ['HP8を捧げる', () => run.hp > 8, () => { run.hp -= 8; const [id] = relicChoices(1, false); if (id){ gainRelic(id); return `お守り「${RELICS[id].n}」を授かった`; } return '何も起きなかった'; }],
         ['立ち去る', () => true, () => '何事もなかった'] ] },
  { t:'札の泉', d:'澄んだ泉。札を浸すと何かが起きそうだ。',
    ch:[ ['札を1組沈める（捨てる）', () => run.deck.length > 4, () => 'pickRemove'],
         ['札を1組清める（強化）', () => run.deck.some(e => !e.u), () => 'pickUpgrade'] ] },
  { t:'賭場', d:'「銭20張って、丁か半か！」',
    ch:[ ['銭20を賭ける', () => run.gold >= 20, () => { const { r, done } = rrng(); const win = r.next() < .5; done(); run.gold += win ? 30 : -20; return win ? '当たり！ 銭+30' : 'はずれ… 銭-20'; }],
         ['立ち去る', () => true, () => '何事もなかった'] ] },
  { t:'迷い猫', d:'お腹をすかせた猫がついてくる。',
    ch:[ ['餌をあげる（銭-10）', () => run.gold >= 10, () => { run.gold -= 10; run.deck.push({ k:'kusuri', u:1 }); return '猫が「薬＋」を1組くわえてきた'; }],
         ['なでる', () => true, () => { heal(5); return 'なごんだ。HP5回復'; }] ] },
];
function randCard(rar){ const { r, done } = rrng(); const k = r.pick(POOL.filter(k => SK[k].r === rar)); done(); return k; }
function openEvent(){
  const { r, done } = rrng();
  const ev = EVENTS[r.int(EVENTS.length)];
  done();
  chooser({ title:ev.t, sub:ev.d, items: ev.ch.map(([label, can, act]) => ({
    html:`<div><div class="nm">${label}</div></div>`, disabled:!can(),
    on:() => {
      const res = act();
      if (res === 'pickRemove') return deckPicker('沈める札', () => true, e => { run.deck.splice(run.deck.indexOf(e), 1); eventDone('札を1組手放した'); }, openEvent);
      if (res === 'pickUpgrade') return deckPicker('清める札', e => !e.u && SK[e.k].r >= 0, e => { e.u = 1; eventDone(`「${SK[e.k].n}」が強化された（${SK[e.k].d(1)}）`); }, openEvent, true);
      eventDone(res);
    } })) });
}
function eventDone(msg){ chooser({ title:'結果', sub:msg, items:[], btn:{ label:'すすむ', on:enterMap } }); }

/* ---------- 山札を見る ---------- */
function showDeck(back){
  const items = [];
  const seen = new Set();
  run.deck.slice().sort((a, b) => SK[a.k].r - SK[b.k].r).forEach(e => {
    const key = e.k + e.u;
    if (seen.has(key)) return;
    seen.add(key);
    items.push({ html:cardPickHTML(e.k, e.u, run.deck.filter(x => x.k === e.k && x.u === e.u).length), cls:'rar' + SK[e.k].r });
  });
  chooser({ title:'山札', sub:`${run.deck.length}組（${run.deck.length * 2}枚）`, items, btn:{ label:'もどる', on:back } });
}

/* ---------- 一時停止 ---------- */
function setPause(p){
  if (!B || B.over) return;
  B.paused = p;
  $('#pauseOv').classList.toggle('on', p);
  if (p){
    const box = $('#ovRelics');
    box.innerHTML = run.relics.map(id => `<div class="pick static">${relicHTML(id)}</div>`).join('');
    wrapJP(box);
    snapBattle();
  }
}
$('#btnPause').addEventListener('click', () => setPause(true));
$('#btnResume').addEventListener('click', () => setPause(false));
// 戦闘中にタイトルへ：その場で保存して戻る（「つづきから」で同じ所から再開）
$('#btnQuitBattle').addEventListener('click', () => {
  snapBattle();
  if (B) B.over = true;
  B = null;
  $('#pauseOv').classList.remove('on');
  enterTitle();
});
// マップからタイトルへ：マップでは保存済みなのでそのまま戻る
$('#btnMapTitle').addEventListener('click', () => { save(); enterTitle(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
window.addEventListener('pagehide', () => snapBattle());

$('#btnNew').addEventListener('click', () => {
  if (loadSave().run && !confirmNew()) return;
  newRun();
});
// 続きのデータがあるときは2回押しで上書き
let newArmed = false;
function confirmNew(){
  if (newArmed) return true;
  newArmed = true;
  $('#btnNew').textContent = '本当に新しく始める？';
  setTimeout(() => { newArmed = false; $('#btnNew').textContent = 'はじめる'; }, 2500);
  return false;
}
$('#btnCont').addEventListener('click', () => {
  const d = loadSave();
  if (!d.run) return;
  run = d.run;
  const pd = run.pending;
  if (pd && pd.won) return afterWin();          // 倒した直後に閉じた → 報酬から
  if (pd && pd.lost) return gameOver();         // 負けた直後に閉じた → 結果から
  if (pd && run.battle) return resumeBattle(run.battle);
  if (pd) return startBattle(pd.foe);           // 途中保存の無い古いデータ
  enterMap();
});
// 山札はどの画面からでも見られる。「もどる」で元の画面へ
// 山札・お守りの一覧はどの画面からでも見られる。「もどる」で元の画面へ
function openSide(fn){
  if ($('#map').classList.contains('on')) return fn(enterMap);
  if (ui.viewingDeck) return;
  const back = ui.lastChooser;
  fn(() => { ui.viewingDeck = false; chooser(back); });
  ui.viewingDeck = true;
}
$('#btnDeck').addEventListener('click', () => openSide(showDeck));
$('#btnRelics').addEventListener('click', () => openSide(showRelics));
function showRelics(back){
  chooser({ title:'お守り', sub:`持っているお守り ${run.relics.length}個`,
    items: run.relics.map(id => ({ html:relicHTML(id), cls:'' })), btn:{ label:'もどる', on:back } });
}
function enterTitle(){
  ui.titleInfo = false;
  applyUnlocks();
  const meta = loadMeta();
  ui.asc = Math.min(ui.asc, meta.maxAsc);
  $('#btnCont').style.display = loadSave().run ? '' : 'none';
  $('#ascRow').style.display = meta.maxAsc > 0 ? '' : 'none';
  renderAsc();
  const n = unlockedCount(meta);
  $('#titleMeta').innerHTML = meta.runs ? `最高得点 ${meta.best}　夜明け ${meta.wins}回<br>解放 ${n}/${UNLOCKS.length}` : '';
  wrapJP($('#titleMeta'));
  show('title');
}
/* ---------- タイトルの説明（遊び方・札の説明） ---------- */

  ['揃', '#b8322a', 'そろえる', '開いている札に同じ札が2枚そろうと、その場で技が出る。札は地の色と薄い形の紋でも見分けられる。そろえた所には山札から次の札が入る。'],
  ['連', '#c98a1a', '連と百鬼夜行', '続けてそろえると「連」が増えて技が強くなる（約2.6秒あくと切れる）。8連で「百鬼夜行」になり、4秒間は全部の札が見えて威力1.6倍。'],

  ['道', '#3c8a48', '夜道を進む', '敵を退散させると銭と札1組がもらえる。マップを下から上へ進む：戦（戦闘）・強（強敵、お守りがもらえる）・休（回復か札の強化）・店・？（できごと）・宝（お守り）。'],
  ['主', '#c4412b', '幕の主と夜明け', '各幕の一番上に「幕の主」が待つ。祓うと次の幕へ。三幕を越えると夜明け。夜明けを迎えるたびに、もっと深い夜（闇）に挑める。'],
  ['巡', '#6a5aa8', 'くり返し遊ぶ', '力尽きても、進んだ分だけ経験がたまり、新しい札やお守りが解放される。周回は自動で保存され、「つづきから」で戦闘の途中からでも再開できる。'],
];
function showHowto(){
  chooser({ info:true, title:'遊び方', sub:'',
    items: HOWTO.map(([g, col, n, d]) => ({ html:`<div class="mini info" style="--k:${col}"><span class="mk">${g}</span></div><div><div class="nm">${n}</div><div class="ds">${d}</div></div>` })),
    btn:{ label:'もどる', on:enterTitle } });

function showCardGuide(){
  const unlocked = new Set(['zan', 'mamo', ...POOL]);
  const keys = Object.keys(SK).filter(k => k !== 'noroi').sort((a, b) => SK[a].r - SK[b].r).concat('noroi');
