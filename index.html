<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17161d">
<title>百鬼めくり</title>
<style>
/* 縦画面1枚。375×667 を 100×177.9 単位(--u)で組む
   見た目の方針：百鬼夜行の夜と「札」。墨の夜・和紙・朱・金・藍の5色を基本に、
   グラデーションや光彩は使わず、平らな面と細い線で組む。見出しと札の字は明朝。 */
:root{
  color-scheme:dark;
  --u: min(1vw, 0.5622vh);
  --bg:#17161d;      /* 墨の夜 */
  --bg2:#1f1d26;
  --panel:#24222c;   /* 面 */
  --line:#3a3644;    /* 細い線 */
  --ink:#ece3cf;     /* 和紙（暗い地の上の文字） */
  --sub:#9d9483;     /* 補足の文字 */
  --paper:#ece3cf;   /* 札の表 */
  --sumi:#2a2622;    /* 和紙の上の墨 */
  --shu:#c4412b;     /* 朱 */
  --kin:#c9a14a;     /* 金 */
  --ai:#3c5a86;      /* 藍 */
  --matcha:#6f9a4e;  /* 自分のHP */
  /* 旧名の色（演出から参照している分を新しい色に寄せる） */
  --yellow:var(--kin); --pink:var(--shu); --red:#d4543c; --green:var(--matcha); --blue:#6f8fc0; --cyan:#7aa7a0;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
}
@supports (height:1dvh){ :root{ --u: min(1vw, 0.5622dvh); } }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--font);font-weight:700;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
body{display:flex;align-items:center;justify-content:center;background:var(--bg)}
#app{position:relative;width:calc(var(--u)*100);height:calc(var(--u)*177.9);font-size:calc(var(--u)*4);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
.btn{display:block;min-width:calc(var(--u)*56);padding:calc(var(--u)*3.2) calc(var(--u)*5);border-radius:calc(var(--u)*1.2);
  background:var(--shu);color:var(--paper);font-weight:900;font-size:calc(var(--u)*5);letter-spacing:.08em;border:1px solid #e0705a}
.btn:active{transform:translateY(1px);filter:brightness(.92)}
.btn.sub{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- タイトル ---------- */
#title{justify-content:center;gap:calc(var(--u)*4)}
.logo{font-family:var(--mincho);font-size:calc(var(--u)*15);font-weight:900;line-height:1;letter-spacing:calc(var(--u)*.6);color:var(--paper);
  padding-bottom:calc(var(--u)*2);border-bottom:calc(var(--u)*.6) solid var(--shu)}
.logo-sub{font-family:var(--mincho);color:var(--kin);font-size:calc(var(--u)*3.8);letter-spacing:.12em}
.title-note{color:var(--sub);font-size:calc(var(--u)*3.4);text-align:center;line-height:1.7;font-weight:500}

#btnVol{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*3);z-index:3}
.volpanel{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*11);z-index:3;display:none;padding:calc(var(--u)*3) calc(var(--u)*4);
  border-radius:calc(var(--u)*1.2);background:var(--panel);border:1px solid var(--line)}
.volpanel.on{display:block}
.vol{display:flex;flex-direction:column;gap:calc(var(--u)*2.4)}
.vol label{display:flex;align-items:center;gap:calc(var(--u)*2.4);font-size:calc(var(--u)*3.6)}
.vol label span{width:calc(var(--u)*11)}
.vol input{width:calc(var(--u)*40);accent-color:var(--kin)}
.vol b{width:calc(var(--u)*7);text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}
.title-links{position:absolute;left:0;right:0;bottom:calc(var(--u)*7);display:flex;justify-content:center;gap:calc(var(--u)*3)}
.title-links .btn{min-width:calc(var(--u)*26.5);padding:calc(var(--u)*2.2) calc(var(--u)*3);font-size:calc(var(--u)*3.8)}
.mini.info{font-family:var(--mincho)}
.title-meta{color:var(--sub);font-size:calc(var(--u)*3.3);text-align:center;line-height:1.6}
.asc{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.2);width:calc(var(--u)*84)}
.ascsel{display:flex;align-items:center;gap:calc(var(--u)*4);font-size:calc(var(--u)*4.6)}
.ascsel b{font-family:var(--mincho);color:var(--shu);min-width:calc(var(--u)*30);text-align:center}
.ascsel button{width:calc(var(--u)*10);height:calc(var(--u)*10);border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:calc(var(--u)*4)}
.ascdesc{color:var(--sub);font-size:calc(var(--u)*3);text-align:center;line-height:1.5;min-height:3em;font-weight:500}
.rsub b{color:var(--kin)}
.heat{display:inline-block;font-family:var(--mincho);font-size:calc(var(--u)*6);color:var(--shu);font-weight:900;margin-bottom:calc(var(--u)*1)}
.heat b{color:var(--shu);font-size:1.3em}

/* ---------- 戦闘 ---------- */
#battle{padding-top:calc(var(--u)*2)}
.topbar{width:calc(var(--u)*94);display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*3.4);color:var(--sub)}
.topbar b{color:var(--ink)}
#fPile,#fDisc{font-variant-numeric:tabular-nums}
.stage{position:relative;width:calc(var(--u)*94);height:calc(var(--u)*40);margin-top:calc(var(--u)*1.2);border-radius:calc(var(--u)*1.6);overflow:hidden;
  background:#141620;border:1px solid var(--line)}
.moon{position:absolute;left:calc(var(--u)*5);top:calc(var(--u)*2.6);width:calc(var(--u)*6.5);height:calc(var(--u)*6.5);border-radius:50%;background:var(--paper)}
.lant{position:absolute;left:calc(var(--u)*16);right:calc(var(--u)*26);top:calc(var(--u)*3.4);display:flex;justify-content:space-between;
  border-top:1px solid rgba(236,227,207,.18);padding-top:calc(var(--u)*.6)}
.lant i{width:calc(var(--u)*2.2);height:calc(var(--u)*3);border-radius:35%;background:var(--shu);animation:lant 1.6s ease-in-out infinite alternate}
.lant i:nth-child(2n){animation-delay:-.8s}
@keyframes lant{to{opacity:.6;transform:rotate(6deg)}}
.road{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*6);
  background:repeating-linear-gradient(90deg,#24222c 0 calc(var(--u)*6),#1d1b24 calc(var(--u)*6) calc(var(--u)*12));animation:road 1.1s linear infinite}
@keyframes road{to{background-position:calc(var(--u)*-12) 0}}
.parade{position:absolute;left:calc(var(--u)*2);bottom:calc(var(--u)*3.4);width:calc(var(--u)*58);height:calc(var(--u)*10);
  display:flex;align-items:flex-end;justify-content:flex-end;gap:calc(var(--u)*.6)}
/* 妖怪（仮のドット絵）。輪郭が夜に沈まないよう淡く光らせる */
.yk{position:relative;flex:none;width:calc(var(--u)*7.6);height:calc(var(--u)*7.6);animation:bob .5s ease-in-out infinite alternate;
  filter:drop-shadow(0 0 calc(var(--u)*.35) rgba(236,227,207,.45))}
.yk svg,.foe svg{display:block;width:100%;height:100%}
.yk.new{animation:yknew .3s cubic-bezier(.2,1.6,.4,1),bob .5s .3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(calc(var(--u)*-1))}}
@keyframes yknew{0%{transform:translateY(calc(var(--u)*-8)) scale(.3)}100%{transform:none}}
.yk.flee{animation:flee .5s ease-in forwards}
@keyframes flee{to{transform:translate(calc(var(--u)*-6),calc(var(--u)*-10)) rotate(-30deg);opacity:0}}
.parade.hurt .yk{animation:ykhurt .3s}
@keyframes ykhurt{30%{transform:translateX(calc(var(--u)*-1.5));filter:brightness(1.6) saturate(0)}}
.parade.glow .yk{outline:calc(var(--u)*.5) solid var(--matcha)}
.run{position:absolute;z-index:1;opacity:.8;animation:run 1.3s linear forwards}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(calc(var(--u)*110))}}
.barrier{position:absolute;left:calc(var(--u)*61);bottom:calc(var(--u)*3);width:calc(var(--u)*1.2);height:calc(var(--u)*14);border-radius:calc(var(--u)*.6);
  background:var(--blue);opacity:0;transition:opacity .2s}
.barrier.on{opacity:.85}
.barrier.ping{animation:ping .35s}
@keyframes ping{40%{transform:scaleX(2.4)}}
.slash{position:absolute;z-index:4;left:calc(var(--u)*20);bottom:calc(var(--u)*5);width:calc(var(--u)*40);height:calc(var(--u)*.8);
  background:var(--shu);transform:rotate(-18deg);animation:slash .3s ease-out forwards}
@keyframes slash{0%{clip-path:inset(0 100% 0 0)}60%{clip-path:inset(0 0 0 0);opacity:1}100%{opacity:0}}
.bolt{position:absolute;z-index:4;right:calc(var(--u)*11);top:0;width:calc(var(--u)*3);height:calc(var(--u)*20);background:var(--kin);
  clip-path:polygon(40% 0,100% 0,60% 40%,100% 40%,20% 100%,40% 52%,0 52%);animation:bolt .3s ease-out forwards}
@keyframes bolt{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.impact{position:absolute;z-index:4;width:calc(var(--u)*12);height:calc(var(--u)*12);margin:calc(var(--u)*-6) 0 0 calc(var(--u)*-6);border-radius:50%;
  border:calc(var(--u)*1.2) solid var(--c);animation:impact .3s ease-out forwards}
@keyframes impact{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.4);opacity:0}}
/* 味方の妖怪の攻撃 */
.yk.atk{position:absolute;z-index:5;animation:none;margin:0}
.cut{position:absolute;z-index:6;width:calc(var(--u)*24);height:calc(var(--u)*1);margin:calc(var(--u)*-.5) 0 0 calc(var(--u)*-12);
  background:var(--paper);animation:cut .32s ease-out forwards}
@keyframes cut{0%{clip-path:inset(0 100% 0 0)}45%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}
.boom{position:absolute;z-index:6;width:calc(var(--u)*30);height:calc(var(--u)*30);margin:calc(var(--u)*-15) 0 0 calc(var(--u)*-15);border-radius:50%;
  background:var(--shu);animation:boom .5s ease-out forwards}
@keyframes boom{0%{transform:scale(.2);opacity:.95}60%{opacity:.7}100%{transform:scale(1.3);opacity:0}}
.flame{position:absolute;z-index:6;width:calc(var(--u)*4);height:calc(var(--u)*6);margin:calc(var(--u)*-3) 0 0 calc(var(--u)*-2);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#d0602e;animation:flame .55s ease-out forwards}
@keyframes flame{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),calc(var(--u)*-12)) scale(1.3);opacity:0}}
.needle{position:absolute;z-index:6;width:calc(var(--u)*.8);height:calc(var(--u)*7);margin-left:calc(var(--u)*-.4);
  background:#a9c6d6;animation:needle .22s ease-in forwards}
@keyframes needle{0%{transform:translateY(calc(var(--u)*-22));opacity:0}30%{opacity:1}100%{transform:translateY(0);opacity:1}}
.orb{position:absolute;z-index:6;width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);margin:calc(var(--u)*-1.1) 0 0 calc(var(--u)*-1.1);border-radius:50%;
  background:var(--matcha);transition:transform .45s ease-in,opacity .45s ease-in}
.seal{position:absolute;z-index:6;width:calc(var(--u)*24);height:calc(var(--u)*24);margin:calc(var(--u)*-12) 0 0 calc(var(--u)*-12);border-radius:50%;
  border:calc(var(--u)*.6) dashed var(--paper);color:var(--paper);font-family:var(--mincho);font-size:calc(var(--u)*7);font-weight:900;
  display:flex;align-items:center;justify-content:center;animation:seal .75s ease-out forwards}
@keyframes seal{0%{transform:scale(1.6) rotate(0);opacity:0}30%{transform:scale(1) rotate(60deg);opacity:1}100%{transform:scale(.9) rotate(140deg);opacity:0}}
.clock{position:absolute;z-index:6;width:calc(var(--u)*20);height:calc(var(--u)*20);margin:calc(var(--u)*-10) 0 0 calc(var(--u)*-10);border-radius:50%;
  border:calc(var(--u)*.6) solid var(--paper);animation:clockf .7s ease-out forwards}
.clock::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--u)*.6);height:calc(var(--u)*8);margin-left:calc(var(--u)*-.3);
  background:var(--paper);transform-origin:50% 0;animation:hand .7s linear forwards}
@keyframes clockf{0%,70%{opacity:1}100%{opacity:0}}
@keyframes hand{from{transform:rotate(180deg)}to{transform:rotate(-180deg)}}
.eyefx{position:absolute;z-index:6;width:calc(var(--u)*16);height:calc(var(--u)*8);margin:calc(var(--u)*-4) 0 0 calc(var(--u)*-8);border-radius:50%;
  background:radial-gradient(circle,var(--sumi) 0 24%,var(--paper) 25% 100%);animation:eyefx .5s ease-out forwards}
@keyframes eyefx{0%{transform:scaleY(0)}30%{transform:scaleY(1)}80%{transform:scaleY(1);opacity:1}100%{transform:scaleY(0);opacity:0}}
.snum{position:absolute;z-index:7;font-weight:900;font-size:calc(var(--u)*7);color:var(--paper);-webkit-text-stroke:calc(var(--u)*.35) var(--sumi);
  transform:translate(-50%,-50%);animation:snum .7s ease-out forwards;white-space:nowrap;font-variant-numeric:tabular-nums}
.snum.big{font-size:calc(var(--u)*10);color:var(--kin)}
@keyframes snum{0%{transform:translate(-50%,-30%) scale(1.8);opacity:0}20%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-150%);opacity:0}}
.parade.power .yk{outline:calc(var(--u)*.5) solid var(--shu);animation:power .5s ease-out}
@keyframes power{40%{transform:scale(1.25) translateY(calc(var(--u)*-1.5))}}
.coinfx{position:absolute;z-index:6;width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);margin:calc(var(--u)*-1.6) 0 0 calc(var(--u)*-1.6);border-radius:50%;
  background:var(--kin);border:calc(var(--u)*.4) solid #8a6d2c;animation:coinfx .6s ease-out forwards}
@keyframes coinfx{0%{transform:translate(0,0)}40%{transform:translate(var(--dx),calc(var(--u)*-9))}100%{transform:translate(var(--dx),calc(var(--u)*-14));opacity:0}}
.ename{position:absolute;right:calc(var(--u)*24);top:calc(var(--u)*7.6);font-family:var(--mincho);font-size:calc(var(--u)*4);font-weight:900;text-align:right}
.etags{position:absolute;right:calc(var(--u)*24);top:calc(var(--u)*13);justify-content:flex-end;max-width:calc(var(--u)*34)}
.foe{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*3.4);z-index:2;width:calc(var(--u)*19);height:calc(var(--u)*19);display:flex;align-items:center;justify-content:center;
  font-family:var(--mincho);font-size:calc(var(--u)*10.5);font-weight:900;color:var(--paper);
  filter:drop-shadow(0 0 calc(var(--u)*.5) rgba(236,227,207,.5))}
.foe::after{content:"";position:absolute;left:15%;right:15%;bottom:calc(var(--u)*-1);height:calc(var(--u)*1.6);border-radius:50%;background:rgba(0,0,0,.45);z-index:-1}
.foe.hit{animation:foehit .25s}
@keyframes foehit{30%{transform:translateX(calc(var(--u)*-2)) scale(.92);filter:brightness(1.5)}70%{transform:translateX(calc(var(--u)*1.5))}}
.foe.act{animation:foeact .35s}
@keyframes foeact{40%{transform:translateX(calc(var(--u)*-22)) scale(1.12)}}
.bar{position:relative;height:calc(var(--u)*4.6);border-radius:calc(var(--u)*.6);background:#0f0e14;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .18s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*3.2)}
.bar.hp i{background:var(--shu)}
.bar.php i{background:var(--matcha)}
.srow{display:flex;align-items:center;gap:calc(var(--u)*2);height:calc(var(--u)*6.4)}
.srow .bar{flex:1}
.tags{display:flex;gap:calc(var(--u)*1.2);flex-wrap:wrap;font-size:calc(var(--u)*3)}
.tag{padding:calc(var(--u)*.3) calc(var(--u)*1.6);border-radius:calc(var(--u)*.6);background:#0f0e14;border:1px solid var(--line)}
.tag.blk{color:var(--blue)} .tag.burn{color:#d0602e} .tag.weak{color:var(--cyan)} .tag.str{color:var(--kin)}
.combo{width:calc(var(--u)*94);height:calc(var(--u)*6);margin-top:calc(var(--u)*.6);display:flex;align-items:center;justify-content:space-between}
.combo .cnum{font-size:calc(var(--u)*5);font-weight:900;color:var(--kin);font-variant-numeric:tabular-nums}
.combo .cnum small{font-size:.6em;color:var(--sub);margin-left:.3em}
.combo .cbar{flex:1;margin-left:calc(var(--u)*3);height:calc(var(--u)*1.6);border-radius:calc(var(--u)*.8);background:#0f0e14;overflow:hidden}
.combo .cbar i{display:block;height:100%;width:0;background:var(--kin)}
.board{position:relative;display:grid;grid-template-columns:repeat(4,calc(var(--u)*22));grid-template-rows:repeat(4,calc(var(--u)*22));
  gap:calc(var(--u)*1.6);justify-content:center;margin-top:calc(var(--u)*.8);perspective:calc(var(--u)*200)}
.slot{position:relative;touch-action:manipulation}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .13s ease-out}
.slot.open .card{transform:rotateY(180deg) scale(1.05)}
.slot.peek .card{transform:rotateY(180deg) scale(.92)}
.slot.empty .card{transform:scale(0);transition:transform .15s ease-in}
.face{position:absolute;inset:0;border-radius:calc(var(--u)*1.6);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
/* 札の裏：藍の地に金の細い枠と「鬼」の紋 */
.back{background:#2a3550;border:1px solid #11141d;box-shadow:inset 0 0 0 calc(var(--u)*1.2) #2a3550,inset 0 0 0 calc(var(--u)*1.5) rgba(201,161,74,.55);
  display:flex;align-items:center;justify-content:center;color:rgba(201,161,74,.5);font-family:var(--mincho);font-size:calc(var(--u)*7);font-weight:900}
/* 札の表：地を技の色で塗る（色で見分ける）。和紙色の細い枠と字、薄い形の紋 */
.front{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;background:var(--k,var(--sumi));color:var(--paper);
  border:1px solid rgba(0,0,0,.4);box-shadow:inset 0 0 0 calc(var(--u)*1) var(--k,var(--sumi)),inset 0 0 0 calc(var(--u)*1.25) rgba(236,227,207,.6)}
.front .mon,.mini .mon{position:absolute;left:14%;top:14%;width:72%;height:72%;fill:rgba(236,227,207,.17)}
.front .kj{position:relative;font-family:var(--mincho);font-size:calc(var(--u)*12);font-weight:900;line-height:1}
.front .nv{position:absolute;right:calc(var(--u)*2);top:calc(var(--u)*1.6);font-size:calc(var(--u)*3.4);font-weight:900;color:var(--paper);font-variant-numeric:tabular-nums}
.front .pl{position:absolute;left:calc(var(--u)*2);top:calc(var(--u)*1.4);font-size:calc(var(--u)*3.4);color:var(--kin)}
.slot.peek .front{filter:brightness(.78) saturate(.85)}   /* 見えているだけの札は少し暗く小さく（色は見分けられる程度） */
.slot.open .front{outline:calc(var(--u)*.8) solid var(--kin);outline-offset:calc(var(--u)*.3)}   /* 押して開いた札は金の枠 */
.tapring{position:absolute;width:calc(var(--u)*16);height:calc(var(--u)*16);margin:calc(var(--u)*-8) 0 0 calc(var(--u)*-8);border-radius:50%;
  border:calc(var(--u)*.6) solid var(--kin);animation:tapring .28s ease-out forwards}
@keyframes tapring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.slot.frozen .back{background:#9fb6c4;color:#2a3550;box-shadow:inset 0 0 0 calc(var(--u)*1.2) #9fb6c4,inset 0 0 0 calc(var(--u)*1.5) #2a3550}
.slot.frozen .back::after{content:"凍";font-size:calc(var(--u)*8)}
.slot.frozen .back{font-size:0}
.slot.closing .front{filter:brightness(.6)}
.slot.pop .card{animation:pop .22s ease-out}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.2)}100%{transform:rotateY(180deg) scale(0)}}
/* 戦闘のメッセージ：連続ゲージのすぐ下。1行固定（長さで盤面が動かないよう、長いときは…で詰める） */
.log{width:calc(var(--u)*94);height:calc(var(--u)*5);line-height:calc(var(--u)*5);text-align:center;font-size:calc(var(--u)*3.5);color:var(--sub);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pausebtn{padding:calc(var(--u)*1) calc(var(--u)*2.4);border-radius:calc(var(--u)*.8);background:var(--panel);border:1px solid var(--line);font-size:calc(var(--u)*3.2)}
.overlay{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4);
  background:rgba(23,22,29,.92)}
.overlay.on{display:flex}
.overlay h2{font-family:var(--mincho);font-size:calc(var(--u)*9);color:var(--paper)}
.ovnote{width:calc(var(--u)*76);text-align:center;font-size:calc(var(--u)*3.2);color:var(--sub);line-height:1.6;font-weight:500}
/* 一時停止中のお守り一覧（上＝名前、下＝説明） */
.ovrel{width:calc(var(--u)*88);border-top:1px solid var(--line);padding-top:calc(var(--u)*2)}
.ovrel-t{font-family:var(--mincho);font-size:calc(var(--u)*3.8);margin-bottom:calc(var(--u)*1.4)}
.ovrel-list{max-height:calc(var(--u)*52);overflow-y:auto;display:flex;flex-direction:column;gap:calc(var(--u)*1.4)}
.ovrel-list .pick{padding:calc(var(--u)*1.6) calc(var(--u)*2)}
.ovrel-list .mini{width:calc(var(--u)*10);height:calc(var(--u)*10);font-size:calc(var(--u)*5.6)}
.ovrel-list .pick .nm{font-size:calc(var(--u)*3.8)}
.ovrel-list .pick .ds{font-size:calc(var(--u)*3)}
.mrow2{display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--u)*2)}
.mrow2 .rrow{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-height:calc(var(--u)*7)}
.mrow2 .rrow::-webkit-scrollbar{display:none}
.mrow2 .rchip{flex:none}   /* お守りが増えても1行のまま（横にスクロール） */
.mrow2 .pausebtn{flex:none}

/* ---------- 演出 ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.sp{position:absolute;width:calc(var(--u)*2);height:calc(var(--u)*2);margin:calc(var(--u)*-1) 0 0 calc(var(--u)*-1);
  animation:sp .6s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes sp{0%{transform:translate(0,0) scale(1.3) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(90deg);opacity:0}}
.rg{position:absolute;width:calc(var(--u)*24);height:calc(var(--u)*24);margin:calc(var(--u)*-12) 0 0 calc(var(--u)*-12);border-radius:50%;
  border:calc(var(--u)*1) solid var(--c);animation:rg .45s ease-out forwards}
@keyframes rg{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.4);opacity:0}}
.num{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:calc(var(--u)*8);white-space:nowrap;font-variant-numeric:tabular-nums;
  -webkit-text-stroke:calc(var(--u)*.4) var(--sumi);animation:num .8s ease-out forwards}
.num.big{font-size:calc(var(--u)*12)}
.num.dmg{color:var(--paper)} .num.hurt{color:var(--red)} .num.heal{color:var(--matcha)} .num.blk{color:var(--blue)}
@keyframes num{0%{opacity:0;transform:translate(-50%,-20%) scale(.4)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.25)}
  100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#app.shake-s{animation:shs .2s linear}
#app.shake-l{animation:shl .35s linear}
@keyframes shs{25%{transform:translate(calc(var(--u)*-.8),calc(var(--u)*.5))}50%{transform:translate(calc(var(--u)*.8),calc(var(--u)*-.5))}75%{transform:translate(calc(var(--u)*-.4),0)}}
@keyframes shl{15%{transform:translate(calc(var(--u)*-2),calc(var(--u)*1)) rotate(-1deg)}35%{transform:translate(calc(var(--u)*2),calc(var(--u)*-1.2)) rotate(1deg)}
  55%{transform:translate(calc(var(--u)*-1.2),calc(var(--u)*.6))}75%{transform:translate(calc(var(--u)*.8),0)}}
.hurtfx{position:absolute;inset:0;z-index:14;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 calc(var(--u)*1.6) var(--shu)}
.hurtfx.on{animation:hurtfx .45s ease-out}
@keyframes hurtfx{0%{opacity:1}100%{opacity:0}}
/* 百鬼夜行中：画面の縁に朱と金の細い枠が脈打つ */
#battle.fever::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  box-shadow:inset 0 0 0 calc(var(--u)*1) var(--shu),inset 0 0 0 calc(var(--u)*1.6) var(--kin);animation:feverp .45s ease-in-out infinite alternate}
@keyframes feverp{to{opacity:.4}}
.banner{position:absolute;left:0;right:0;top:46%;text-align:center;font-family:var(--mincho);font-weight:900;font-size:calc(var(--u)*15);color:var(--paper);
  letter-spacing:.06em;text-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 var(--shu);animation:banner 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes banner{0%{opacity:0;transform:scale(2.4)}20%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1.03)}100%{opacity:0;transform:scale(.9)}}
.banner.kill{text-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 var(--sumi)}
.cnum.pop{animation:cpop .25s ease-out}
@keyframes cpop{40%{transform:scale(1.4)}}
.foe.dead{animation:dead .7s ease-in forwards}
@keyframes dead{30%{transform:scale(1.2);filter:brightness(1.6)}100%{transform:scale(.2) rotate(30deg);opacity:0}}
@media (prefers-reduced-motion: reduce){ #app.shake-s,#app.shake-l{animation:none} }

/* 盤面のすぐ上の帯。各欄の幅は固定（防御などが出ても文字やバーが動かない） */
.mid{width:calc(var(--u)*92.8);height:calc(var(--u)*12);margin-top:calc(var(--u)*.4);display:flex;align-items:center;gap:calc(var(--u)*2);padding:0 calc(var(--u)*2);
  border-radius:calc(var(--u)*1.2);background:#0f0e14;border:1px solid var(--line)}
.mside{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.2)}
.ma{display:flex;align-items:baseline;justify-content:space-between;height:calc(var(--u)*4.6);font-size:calc(var(--u)*3.7);white-space:nowrap;overflow:hidden}
.mid b{font-weight:900;font-variant-numeric:tabular-nums}
.mid b small{font-size:.62em;color:var(--sub);font-weight:700}
.mid .ic{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:900}   /* 入りきらないときは行動の文字の方を詰める */
.mid .ic.atk{color:var(--red)} .mid .ic.def{color:var(--blue)} .mid .ic.special{color:var(--kin)}
#eHp{flex:none;min-width:calc(var(--u)*15);padding-left:calc(var(--u)*1);text-align:right;color:#e07a63}   /* 数字は切らない（足りなければ広がる） */
#pHp{flex:none;min-width:calc(var(--u)*13);color:var(--matcha)}
#pHp.low{color:var(--red)}
.pt{flex:none;min-width:calc(var(--u)*11);text-align:right;font-size:calc(var(--u)*3.1);font-weight:900;visibility:hidden;white-space:nowrap}
.pt.blk{color:var(--blue)} .pt.str{color:var(--kin)}
.ptags{display:flex;flex:none}
.mbar{position:relative;height:calc(var(--u)*1.8);border-radius:calc(var(--u)*.4);background:#23212b;overflow:hidden}
.mbar i{position:absolute;left:0;top:0;bottom:0;transition:width .18s}
.mbar.hp i{background:var(--shu)}
.mbar.php i{background:var(--matcha)}
.ring{flex:none;width:calc(var(--u)*10);height:calc(var(--u)*10);border-radius:50%;padding:calc(var(--u)*1)}
.ring span{width:100%;height:100%;border-radius:50%;background:#0f0e14;display:flex;align-items:center;justify-content:center;
  font-family:var(--mincho);font-size:calc(var(--u)*4.2);font-weight:900;color:var(--paper)}
.ring.hot{animation:ringhot .3s ease-in-out infinite alternate}
@keyframes ringhot{to{transform:scale(1.08)}}

/* 退散・敗北は盤面の真上に出す（盤面を見ていても気づけるように） */
#battle.ended .slot{filter:grayscale(.7) brightness(.45);transition:filter .3s}
.endov{position:absolute;inset:calc(var(--u)*-1);z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:calc(var(--u)*1.6);background:rgba(23,22,29,.55);animation:endbg .3s ease-out}
.endov b{font-family:var(--mincho);font-size:calc(var(--u)*18);font-weight:900;line-height:1;color:var(--paper);
  text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--shu);animation:endst .55s cubic-bezier(.2,1.5,.4,1)}
.endov span{margin-top:calc(var(--u)*3);font-family:var(--mincho);font-size:calc(var(--u)*4.8);color:var(--kin);animation:endbg .5s .25s both}
.endov.lose b{color:#b8b0a0;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--sumi)}
.endov.lose span{color:var(--sub)}
@keyframes endbg{from{opacity:0}to{opacity:1}}
@keyframes endst{0%{transform:scale(2.6);opacity:0}60%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}
/* 画面が切り替わった直後は、連打の勢いで選んでしまわないよう少しのあいだ押せない */
.screen.guard{pointer-events:none}
.screen.guard .pick,.screen.guard .btn,.screen.guard .node{opacity:.4}
.pick,.btn,.node{transition:opacity .25s}

/* ---------- マップ ---------- */
#map{padding-top:calc(var(--u)*19)}
.mhead.runbar{position:absolute;left:calc(var(--u)*3);top:calc(var(--u)*2);z-index:12;display:none}
.mhead.runbar.on{display:flex}   /* .mhead の display より強くする（戦闘・タイトルでは確実に隠す） */
.mhead{width:calc(var(--u)*94);display:flex;flex-direction:column;gap:calc(var(--u)*1.6)}
.mrow{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*3.6)}
.mrow b{color:var(--kin)}
.rrow{display:flex;gap:calc(var(--u)*1.4);flex-wrap:wrap;min-height:calc(var(--u)*7)}
/* お守りの小札（タップで名前と説明） */
.rchip{width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;background:var(--sumi);color:var(--kin);font-family:var(--mincho);font-size:calc(var(--u)*3.8);
  display:flex;align-items:center;justify-content:center;border:1px solid var(--kin)}
.rchip.boss{color:var(--shu);border-color:var(--shu)}
.brel{width:calc(var(--u)*94);height:calc(var(--u)*6);min-height:0;margin-top:calc(var(--u)*.8);flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.brel::-webkit-scrollbar{display:none}
.brel .rchip{flex:none;width:calc(var(--u)*6);height:calc(var(--u)*6);font-size:calc(var(--u)*3.2)}
.mscroll{flex:1;width:100%;overflow-y:auto;margin-top:calc(var(--u)*1);-webkit-overflow-scrolling:touch}
.mbox{position:relative;width:100%}
.mbox svg{position:absolute;left:0;top:0}
.mbox line{stroke:#3a3644;stroke-width:2;stroke-dasharray:4 6}
.mbox line.walked{stroke:var(--kin);stroke-dasharray:none}
.node{position:absolute;width:calc(var(--u)*12);height:calc(var(--u)*12);margin:calc(var(--u)*-6) 0 0 calc(var(--u)*-6);border-radius:50%;
  background:var(--panel);border:1px solid var(--line);color:var(--sub);font-family:var(--mincho);font-size:calc(var(--u)*5.6);font-weight:900;
  display:flex;align-items:center;justify-content:center}
.node.t-elite{color:var(--red)} .node.t-rest{color:var(--matcha)} .node.t-shop{color:var(--kin)} .node.t-event{color:var(--cyan)} .node.t-treasure{color:var(--kin)}
.node.t-boss{width:calc(var(--u)*20);height:calc(var(--u)*20);margin:calc(var(--u)*-10) 0 0 calc(var(--u)*-10);font-size:calc(var(--u)*10);background:var(--shu);color:var(--paper);border-color:var(--sumi)}
.node.done{opacity:.4}
.node.here{opacity:1;border:calc(var(--u)*.6) solid var(--kin)}
/* 次に行ける所：和紙色の札にして、金の輪が呼吸する */
.node.can{background:var(--paper);color:var(--sumi);border-color:var(--kin)}
.node.can::after{content:"";position:absolute;inset:calc(var(--u)*-1.4);border-radius:50%;border:calc(var(--u)*.5) solid var(--kin);animation:nodepulse 1.2s ease-in-out infinite}
@keyframes nodepulse{50%{transform:scale(1.15);opacity:.2}}
.board.stir{animation:stir .4s}
@keyframes stir{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.toast{position:absolute;left:50%;bottom:calc(var(--u)*8);transform:translateX(-50%);z-index:40;width:max-content;max-width:calc(var(--u)*88);
  padding:calc(var(--u)*2.4) calc(var(--u)*4);border-radius:calc(var(--u)*1.2);background:var(--sumi);border:1px solid var(--kin);color:var(--ink);
  font-size:calc(var(--u)*3.4);text-align:left;opacity:0;pointer-events:none}
.toast .tn{font-family:var(--mincho);font-size:calc(var(--u)*4.4);color:var(--kin);font-weight:900}
.toast .td{margin-top:calc(var(--u)*1);font-weight:500;line-height:1.5}
.toast.on{animation:toast 2.6s ease forwards}
@keyframes toast{8%,82%{opacity:1}100%{opacity:0}}

/* ---------- 選択画面（報酬・店・休憩・できごと） ---------- */
#choose{padding:calc(var(--u)*20) calc(var(--u)*5) calc(var(--u)*4);gap:calc(var(--u)*2.4)}
#choose h2{font-family:var(--mincho);font-size:calc(var(--u)*8);color:var(--paper);font-weight:900;letter-spacing:.06em}
.rsub{color:var(--sub);font-size:calc(var(--u)*3.6);text-align:center;line-height:1.6;font-weight:500}
.picks{display:flex;flex-direction:column;gap:calc(var(--u)*1.6);width:100%;flex:1;min-height:0;overflow-y:auto;padding:calc(var(--u)*1) 0}
.picks:empty{flex:0}
.pick{flex:none;position:relative;display:flex;align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*2.2) calc(var(--u)*2.6);border-radius:calc(var(--u)*1.2);
  background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.pick:not(.static):active{transform:scale(.98);border-color:var(--kin)}
.pick[disabled]{opacity:.4}
.pick > div:last-of-type{flex:1;min-width:0}
/* 札の見本（戦闘の札と同じ見た目） */
.mini{flex:none;width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:calc(var(--u)*1.2);display:flex;align-items:center;justify-content:center;
  background:var(--k,var(--sumi));color:var(--paper);font-family:var(--mincho);font-size:calc(var(--u)*7.6);font-weight:900;position:relative;
  box-shadow:inset 0 0 0 calc(var(--u)*.8) var(--k,var(--sumi)),inset 0 0 0 calc(var(--u)*1) rgba(236,227,207,.6)}
.mini .mk{position:relative}
.mini.relic{border-radius:50%;background:var(--sumi);color:var(--kin);box-shadow:none;border:1px solid var(--kin)}
.mini.relic.boss{color:var(--shu);border-color:var(--shu)}
.mini .x2{position:absolute;right:calc(var(--u)*-1.5);bottom:calc(var(--u)*-1.5);font-family:var(--font);font-size:calc(var(--u)*2.8);background:var(--sumi);color:var(--ink);
  border:1px solid var(--line);border-radius:calc(var(--u)*.6);padding:0 calc(var(--u)*1)}
/* 結果画面 */
#choose.norun{padding-top:calc(var(--u)*7)}
.res{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.6);width:calc(var(--u)*90)}
.res-reach{font-size:calc(var(--u)*3.8);color:var(--ink)}
.res-reach em{font-style:normal;margin-left:calc(var(--u)*2);padding:0 calc(var(--u)*1.6);border:1px solid var(--shu);border-radius:calc(var(--u)*.6);color:var(--shu);font-size:.85em}
.res-heat{display:flex;flex-direction:column;align-items:center;line-height:1.25}
.res-heat .hl{font-size:calc(var(--u)*3.2);color:var(--sub);letter-spacing:.2em}
.res-heat .hd{font-size:calc(var(--u)*15);font-weight:900;color:var(--shu);font-variant-numeric:tabular-nums;line-height:1.05}
.res-heat .hd small{font-size:.4em;margin-left:.05em}
.res-heat .hn{font-family:var(--mincho);font-size:calc(var(--u)*5.6);font-weight:900;color:var(--kin);margin-top:calc(var(--u)*.8)}
.res-heat .hx{font-size:calc(var(--u)*3.4);color:var(--ink);font-weight:500;margin-top:calc(var(--u)*.8)}
.res-heat .ht{font-size:calc(var(--u)*3);color:var(--sub);font-weight:500;margin-top:calc(var(--u)*.6)}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:100%;background:var(--line);border:1px solid var(--line);border-radius:calc(var(--u)*1.2);overflow:hidden}
.res-grid .rc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.6);padding:calc(var(--u)*2.2) 0;background:var(--panel)}
.res-grid .rc b{font-size:calc(var(--u)*6);font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.res-grid .rc span{font-size:calc(var(--u)*2.8);color:var(--sub);font-weight:500}
.res-grid .rc.best b{color:var(--kin)}
.res-grid .rc.best span::after{content:" 更新";color:var(--kin)}
.res-note{font-size:calc(var(--u)*3.6);color:var(--kin)}
.res-sec{align-self:stretch;text-align:left;font-family:var(--mincho);font-size:calc(var(--u)*4);color:var(--ink);padding-top:calc(var(--u)*1);border-top:1px solid var(--line)}

/* 名前と説明は必ず2行（上＝名前、下＝説明） */
.pick .nm{display:block;font-size:calc(var(--u)*4.4);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .nm small{color:var(--sub);font-size:.65em;font-weight:700}
.pick .ds .ug{white-space:nowrap}
.pick .ds em{font-style:normal;font-weight:900;color:var(--kin)}
.pick .ds{display:block;margin-top:calc(var(--u)*.6);font-size:calc(var(--u)*3.2);color:var(--sub);font-weight:500;line-height:1.45}
.pick .price{flex:none;font-size:calc(var(--u)*3.8);color:var(--kin);font-variant-numeric:tabular-nums}
.rar1 .nm{color:#a9c6c0} .rar2 .nm{color:var(--kin)}
</style>
</head>
<body>
<div id="app">
  <div id="fx"></div>
  <div class="hurtfx" id="hurtfx"></div>

  <section id="title" class="screen on">
    <button class="pausebtn" id="btnVol">音量</button>
    <div class="volpanel" id="volPanel"><div class="vol"><label><span>BGM</span><input type="range" min="0" max="100" step="5" class="volBgm"><b class="volBgmN"></b></label><label><span>効果音</span><input type="range" min="0" max="100" step="5" class="volSe"><b class="volSeN"></b></label></div></div>
    <div class="logo">百鬼めくり</div>
    <div class="logo-sub">めくって、そろえて、百鬼を祓え。</div>
    <button class="btn" id="btnNew">はじめる</button>
    <button class="btn sub" id="btnCont" style="display:none">つづきから</button>
    <div class="asc" id="ascRow" style="display:none">
      <div class="ascsel"><button id="ascDn">◀</button><b id="ascNum"></b><button id="ascUp">▶</button></div>
      <div class="ascdesc" id="ascDesc"></div>
    </div>
    <div class="title-meta" id="titleMeta"></div>
    <div class="title-note">札をどんどんめくれ<br>同じ絵柄が2枚開いたら即発動<br>妖怪は待ってくれない</div>
    <!-- 説明は画面の下段に（「はじめる」「つづきから」の近くに置かない） -->
    <div class="title-links"><button class="btn sub" id="btnHow">遊び方</button><button class="btn sub" id="btnCards">札の説明</button></div>
  </section>

  <section id="battle" class="screen">
    <div class="topbar">
      <span><b id="tFloor">1</b>階</span>
      <span>銭 <b id="tGold">0</b></span>
      <span id="fPile">山 0</span>
      <span id="fDisc">捨 0</span>
      <button class="pausebtn" id="btnPause">一時停止</button>
    </div>
    <!-- 持っているお守り。1行固定（多いときは横にスクロール）。下側は盤面だけにする -->
    <div class="rrow brel" id="bRelics"></div>
    <!-- 場面：左が味方の百鬼の行列、右が敵。そろえた札の妖怪が行列に加わり、敵に飛びかかる -->
    <div class="stage" id="stage">
      <div class="moon"></div>

<script>

/* =========================================================

/* ---------- 乱数（シード式） ---------- */
function hashStr(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function makeRng(state){
  return {
    s: state >>> 0,
    next(){
      let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    int(n){ return Math.floor(this.next() * n); },
    pick(a){ return a[this.int(a.length)]; },
    shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = this.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  };
}
function randomSeed(){
  const C = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += C[Math.floor(Math.random() * C.length)];
  return s;
}

// 札の地に薄く入れる形の紋（色が似ていても形で見分けられるように）

// 解放済みの札だけが報酬・店に出る
let POOL = ALL_POOL.slice();
const STARTER = [['zan',4],['mamo',4],['ren',1],['sukasu',1]];
const RAR_NAME = ['ふつう','ちょっと珍しい','レア'];

/* ---------- 敵 ----------

  nuri:   { n:'塗壁',     e:'壁', hp:140, iv:3.3, col:'#a8a29e', it:[['def',12],['atk',10],['def',10],['atk',11]] },
  kitsune:{ n:'狐火',     e:'狐', hp:115, iv:3.1, col:'#fb923c', it:[['curse',1],['atk',8],['shuffle'],['atk',8]] },
  karasu: { n:'烏天狗',   e:'烏', hp:120, iv:3.0, col:'#475569', it:[['atk',5,2],['freeze',3],['atk',10]] },
  tengu:  { n:'大天狗',   e:'天', hp:160, iv:3.0, col:'#ef4444', it:[['atk',4,3],['buff',2],['shuffle'],['atk',12]] },

  kyubi:  { n:'九尾',     e:'尾', hp:260, iv:3.3, col:'#f59e0b', it:[['atk',5,3],['curse',1],['shuffle'],['atk',13],['def',15],['freeze',3],['buff',2]] },
  // 第3幕（第1幕のHP約1.8倍・攻撃約1.3倍）
  gasha:  { n:'餓者髑髏', e:'骨', hp:160, iv:3.0, col:'#e7e5e4', it:[['atk',11],['atk',4,3],['def',12]] },
  raiju:  { n:'雷獣',     e:'獣', hp:145, iv:2.8, col:'#facc15', it:[['atk',3,4],['freeze',3],['atk',10]] },
  hannya: { n:'般若',     e:'般', hp:155, iv:3.0, col:'#f43f5e', it:[['buff',2],['atk',10],['curse',1],['atk',10]] },
  kage:   { n:'影法師',   e:'影', hp:140, iv:2.8, col:'#334155', it:[['shuffle'],['atk',8,2],['shuffle'],['atk',11]] },

  mukade: { n:'大百足',   e:'百', hp:230, iv:3.0, col:'#b45309', it:[['atk',3,5],['def',16],['buff',2],['atk',13]] },
  orochi: { n:'八岐大蛇', e:'蛇', hp:360, iv:3.1, col:'#16a34a', it:[['atk',6,3],['curse',1],['atk',16],['shuffle'],['freeze',4],['def',20],['buff',2],['atk',3,5]] },
});
const ACTS = [
  { easy:['oni','chochin'], normal:['oni','chochin','hitotsu','kappa'], elite:['yuki','oogumo'], boss:'onibi' },
  { easy:['kama','kitsune'], normal:['kama','nuri','kitsune','karasu'], elite:['tengu','ushioni'], boss:'kyubi' },
  { easy:['gasha','kage'], normal:['gasha','raiju','hannya','kage'], elite:['nue','mukade'], boss:'orochi' },
];

/* ---------- 闇（難度）：夜が深いほど妖怪が強い ---------- */
const ASC = [
  '',
  '強敵のHP +20%',
  '通常の敵のHP +15%',
  '幕の主のHP +15%',
  '敵の攻撃 +15%',
  '休憩の回復が2割に',
  '最初のHPが54',
  '最初の山札に「呪」1組',
  '敵の行動が5%速い',
  '店が1割高い',
  '幕の主の攻撃 +20%',
];
const asc = n => !!run && run.asc >= n;

/* ---------- 解放 ----------
   周回が終わるたびに「経験」（到達階＋幕の主を祓った数×10）がたまり、12ごとに1つ解放 */
const UNLOCKS = [
  ['card','ame'], ['relic','rengai'], ['card','kyu'], ['relic','yonetsu'], ['card','ka'], ['relic','nitou'],
  ['card','baku'], ['relic','kyoran'], ['card','zen'], ['relic','onime'], ['card','rai'], ['relic','fukutsu'],
];
const UNLOCK_STEP = 12;
function loadMeta(){ const m = loadSave().meta || {}; return Object.assign({ best:0, runs:0, wins:0, pts:0, maxAsc:0 }, m); }
function unlockedCount(meta){ return Math.min(UNLOCKS.length, Math.floor(meta.pts / UNLOCK_STEP)); }
function applyUnlocks(){
  const n = unlockedCount(loadMeta());
  const locked = UNLOCKS.slice(n);
  POOL = ALL_POOL.filter(k => !locked.some(([t, id]) => t === 'card' && id === k));
  LOCKED_RELICS = locked.filter(([t]) => t === 'relic').map(([, id]) => id);
}
let LOCKED_RELICS = [];

/* ---------- 定数 ---------- */
const SLOTS = 16;
const OPEN_MS = 1100;     // 開いた札が閉じるまで
const MAX_OPEN = 3;       // 同時に開ける枚数
const COMBO_MS = 2600;    // そろえてから次をそろえるまでの猶予
const FEVER_AT = 8;
const FEVER_MS = 4000;
const REFILL_MS = 420;
const PLAYER_HP = 60;
const SAVE_KEY = 'hyakki-mekuri.v1';
const OLD_SAVE_KEY = 'dopa-mekuri.v1'; // 旧名のころの保存（読み込みのみ）

/* ---------- 状態 ---------- */
let run = null;   // 周回（保存対象）
let B = null;     // 戦闘中の状態（保存しない）
const ui = { asc:0 };
const DEBUG = { speed:1 }; // テスト用の時間倍率
const $ = s => document.querySelector(s);
const show = id => {
  document.querySelectorAll('.screen').forEach(e => e.classList.toggle('on', e.id === id));
  // 周回中のマップ・選択画面では、上部欄（幕・HP・銭・山札・お守り）をいつも出す
  const bar = run && !ui.titleInfo && (id === 'map' || id === 'choose');
  $('#runbar').classList.toggle('on', !!bar);
  $('#choose').classList.toggle('norun', id === 'choose' && (!run || ui.titleInfo));
  bgmMode(id === 'battle' ? (run && run.pending && run.pending.kind === 'boss' ? 'boss' : 'battle') : 'night');
  if (bar){
    renderMapHead();
    $('#btnMapTitle').style.display = id === 'map' ? '' : 'none';   // タイトルへはマップだけ
  }
};

function newRun(){
  const seed = randomSeed();
  const hp = ui.asc >= 6 ? 54 : PLAYER_HP;
  run = { v:1, seed, asc:ui.asc, hp, maxHp:hp, gold:0, floor:0, act:1, deck:[], relics:['chishio'],
          rs:hashStr(seed + '|run'), at:-1, path:[], removes:0, lastFoe:null, pending:null, shop:null, bosses:0,
          stats:{ taps:0, matches:0, misses:0, maxCombo:0, fevers:0, ms:0, battles:0 } };
  STARTER.forEach(([k, n]) => { for (let i = 0; i < n; i++) run.deck.push({ k, u:0 }); });
  if (asc(7)) run.deck.push({ k:'noroi', u:0 });
  run.map = genMap(1);
  enterMap();
}
// 周回の乱数（状態を保存）
function rrng(){ const r = makeRng(run.rs); return { r, done(){ run.rs = r.s; } }; }

/* ---------- 保存 ---------- */
function loadSave(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY) || localStorage.getItem(OLD_SAVE_KEY)) || {}; } catch(e){ return {}; } }
function writeSave(d){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch(e){} }
function save(){ const d = loadSave(); d.run = run; writeSave(d); }

/* ---------- 戦闘 ---------- */
function startBattle(foeId){
  const f = FOES[foeId];
  const kind = run.pending ? run.pending.kind : 'fight';
  let hpMul = 1, atkMul = 1, ivMul = hasR('hakuhyo') ? 1.1 : 1;
  if (kind === 'elite' && asc(1)) hpMul *= 1.2;
  if (kind === 'fight' && asc(2)) hpMul *= 1.15;
  if (kind === 'boss' && asc(3)) hpMul *= 1.15;
  if (asc(4)) atkMul *= 1.15;
  if (asc(8)) ivMul *= 0.95;
  if (kind === 'boss' && asc(10)){ atkMul *= 1.2; if (run.act === 3) hpMul *= 1.15; }
  const maxHp = Math.round(f.hp * hpMul);
  const rng = makeRng(hashStr(run.seed + '|battle|' + run.floor));
  const cards = [];
  let uid = 0;
  run.deck.forEach(p => { cards.push({ id:uid++, k:p.k, u:p.u }, { id:uid++, k:p.k, u:p.u }); });
  rng.shuffle(cards);
  B = {
    foeId, f, rng, uid,
    pile: cards, disc: [], slots: new Array(SLOTS).fill(null),
    t: 0, last: 0, paused:false, over:false,
    e: { hp:maxHp, max:maxHp, blk:0, str:0, burn:hasR('hidane') ? 6 : 0, weak:0, step:0, timer:0, iv:f.iv * 1000 * ivMul, atkMul },
    fuku: hasR('fukutsu'), nMatch:0,
    p: { blk:0, str:0 },
    combo:0, lastMatch:-1e9, fever:false, feverEnd:0, burnAcc:0,
    stats:{ taps:0, matches:0, misses:0, maxCombo:0, fevers:0 },
    queue:[],
  };
  for (let i = 0; i < SLOTS; i++) dealTo(i);
  if (hasR('sakiyomi')) B.slots.forEach(sl => { if (sl) sl.peekUntil = 1500; });
  showBattle();
  log(`${f.n} があらわれた！`);
  snapBattle();
}
/* ---------- 戦闘の途中保存 ----------
   盤面・山札・HP・防御・連続・百鬼夜行・敵の行動ゲージまで丸ごと保存し、同じ所から再開する。
   開いていた札は伏せ直し、そろえて空いていた所は再開時に補充する。 */
const SNAP_MS = 2000;
function snapBattle(){
  if (!B || B.over || !run) return;
  run.battle = {
    foeId:B.foeId, rs:B.rng.s, uid:B.uid, pile:B.pile, disc:B.disc,
    slots:B.slots.map(sl => sl && sl.st !== 'gone' ? { c:sl.c, frozenUntil:sl.frozenUntil || 0 } : null),
    t:B.t, e:B.e, p:B.p, combo:B.combo, lastMatch:B.lastMatch, fever:B.fever, feverEnd:B.feverEnd,
    burnAcc:B.burnAcc, stats:B.stats, fuku:B.fuku, nMatch:B.nMatch,
  };
  B.lastSnap = B.t;
  save();
}
function resumeBattle(sn){
  const f = FOES[sn.foeId];
  B = {
    foeId:sn.foeId, f, rng:makeRng(sn.rs), uid:sn.uid, pile:sn.pile, disc:sn.disc,
    slots:sn.slots.map(x => x ? { c:x.c, st:'down', at:0, frozenUntil:x.frozenUntil } : null),
    t:sn.t, last:0, paused:false, over:false, e:sn.e, p:sn.p,
    combo:sn.combo, lastMatch:sn.lastMatch, fever:sn.fever, feverEnd:sn.feverEnd, burnAcc:sn.burnAcc,
    stats:sn.stats, fuku:sn.fuku, nMatch:sn.nMatch, queue:[], lastSnap:sn.t,
  };
  for (let i = 0; i < SLOTS; i++) if (!B.slots[i]) dealTo(i, true);
  showBattle();
  log('続きから再開。「つづける」で動き出す');
  setPause(true);   // いきなり敵が動かないよう、一時停止から始める
}

// 戦闘画面を B の状態から組み立てて、時間を動かし始める
function showBattle(){

const PULL = 0.5; // 補充で「盤上で相方のいない札の相方」を引き寄せる確率
function draw(pull){
  if (!B.pile.length){
    if (!B.disc.length) return null;
    B.pile = B.rng.shuffle(B.disc);
    B.disc = [];
    log('捨て札を切り直した');
  }
  if (pull && B.rng.next() < PULL){
    const cnt = {};
    B.slots.forEach(s => { if (s && s.st === 'down') cnt[s.c.k] = (cnt[s.c.k] || 0) + 1; });
    const lonely = Object.keys(cnt).filter(k => cnt[k] % 2 === 1 && k !== 'noroi');
    const j = B.pile.findIndex(c => lonely.includes(c.k));
    if (j >= 0) return B.pile.splice(j, 1)[0];
  }
  return B.pile.pop();
}
// pull=true は戦闘中の補充（最初の配札は完全にランダム）
function dealTo(i, pull){
  const c = draw(pull);
  B.slots[i] = c ? { c, st:'down', at:0, frozenUntil:0 } : null;
}

/* ---------- 盤の描画 ---------- */
function buildBoard(){
  const bd = $('#board');
  bd.innerHTML = '';
  for (let i = 0; i < SLOTS; i++){
    const el = document.createElement('div');
    el.className = 'slot';
    el.innerHTML = '<div class="card"><div class="face back">百</div><div class="face front"></div></div>';
    el.addEventListener('pointerdown', e => { e.preventDefault(); tap(i); });
    bd.appendChild(el);
  }
  for (let i = 0; i < SLOTS; i++) renderSlot(i);
}
function slotEl(i){ return $('#board').children[i]; }
function renderSlot(i){
  const el = slotEl(i), s = B.slots[i];
  el.classList.toggle('empty', !s);
  if (!s){ el.classList.remove('open','peek','frozen','closing'); return; }
  const sk = SK[s.c.k], fr = el.querySelector('.front');
  if (fr.dataset.key !== s.c.k + s.c.u){
    fr.dataset.key = s.c.k + s.c.u;
    fr.style.setProperty('--k', sk.col);
    const nv = sk.nv(s.c.u);
    fr.innerHTML = monSVG(s.c.k) + `<span class="kj">${sk.n}</span>` + (nv ? `<span class="nv">${nv % 1 ? nv.toFixed(1) : nv}</span>` : '')
                 + (s.c.u ? '<span class="pl">＋</span>' : '');
  }
  el.classList.toggle('open', s.st === 'open');
  el.classList.toggle('peek', s.st === 'down' && (B.fever || (s.peekUntil || 0) > B.t));
  el.classList.toggle('frozen', s.st === 'down' && s.frozenUntil > B.t);
}
// 色を墨の灰色に少し寄せて、派手すぎない色にする
function mute(hex, k = .35){
  const n = parseInt(hex.slice(1), 16), g = [0x4a, 0x44, 0x50];
  const m = (v, i) => Math.round(v * (1 - k) + g[i] * k);
  return `rgb(${m(n >> 16, 0)},${m((n >> 8) & 255, 1)},${m(n & 255, 2)})`;
}

/* ---------- 操作 ---------- */
function tap(i){
  if (!B || B.over || B.paused) return;
  const s = B.slots[i];
  if (!s || s.st !== 'down' || s.frozenUntil > B.t) return;
  B.stats.taps++;
  // 開きすぎたら一番古い札を閉じる
  const open = openSlots();
  if (open.length >= maxOpen()) closeSlot(open[0], true);
  s.st = 'open';
  s.at = B.t;
  renderSlot(i);
  const p = appPos(slotEl(i));
  fx('tapring', p.x, p.y, null, null, 300);   // 押した手応え
  sfx('flip');
  tryMatch(i);
}
const openSlots = () => B.slots.map((s, i) => s && s.st === 'open' ? i : -1).filter(i => i >= 0).sort((a, b) => B.slots[a].at - B.slots[b].at);

function closeSlot(i, miss){
  const s = B.slots[i];
  if (!s || s.st !== 'open') return;
  s.st = 'down';
  renderSlot(i);
  if (miss){
    B.stats.misses++;
    comboBreak();
    if (hasR('kyoran')) hurtMe(1, true);
  }
}

function tryMatch(i){
  const s = B.slots[i];
  const others = openSlots().filter(j => j !== i);
  // 同じ札が最優先、なければ鏡
  let j = others.find(j => B.slots[j].c.k === s.c.k);
  if (j === undefined && s.c.k === 'kagami') j = others[0];
  if (j === undefined) j = others.find(j => B.slots[j].c.k === 'kagami');
  if (j === undefined) return;
  matchPair(j, i);
}

function matchPair(i, j){
  const a = B.slots[i].c, b = B.slots[j].c;
  B.slots[i].st = B.slots[j].st = 'gone';
  // コンボ
  B.combo = (B.t - B.lastMatch <= COMBO_MS || B.combo === 0) ? B.combo + 1 : 1;
  B.lastMatch = B.t;
  B.stats.matches++;
  // 鏡は相手の札を倍で発動
  let k = a.k, u = a.u, times = 1;
  if (a.k === 'kagami' && b.k !== 'kagami'){ k = b.k; u = b.u; times = a.u ? 3 : 2; }
  else if (b.k === 'kagami' && a.k !== 'kagami'){ times = b.u ? 3 : 2; }
  else if (a.k === 'kagami' && b.k === 'kagami'){ k = null; B.combo += 2 + a.u; }
  if (k === 'ren') B.combo += 1;
  B.stats.maxCombo = Math.max(B.stats.maxCombo, B.combo);
  if (!B.fever && B.combo >= feverAt()){ startFever(); }
  B.nMatch++;
  if (hasR('nitou') && B.nMatch % 5 === 0) times *= 2;
  if (hasR('rengai')) B.p.blk += 1;
  const m = mult();
  B.hitLog = [];
  if (k) for (let t = 0; t < times && !B.over; t++) applySkill(k, u, m);
  const hits = B.hitLog;
  B.hitLog = null;
  [i, j].forEach(x => {
    const el = slotEl(x);
    el.classList.remove('open'); el.classList.add('pop');
    B.disc.push(B.slots[x].c);
    B.queue.push({ at:B.t + REFILL_MS, slot:x });
  });
  burst([i, j], k ? SK[k].col : '#e2e8f0', B.combo);
  sfx('match', B.combo);
  stageAct(k || 'kagami', hits);
  setTimeout(() => [i, j].forEach(x => slotEl(x).classList.remove('pop')), 230);
  setTimeout(() => [i, j].forEach(x => { if (B && B.slots[x] && B.slots[x].st === 'gone'){ B.slots[x] = null; renderSlot(x); } }), 220);
  renderCombo();
  renderStatus();
}
function mult(){ return (1 + Math.min(B.combo - 1, 12) * 0.1 * (hasR('kyoran') ? 2 : 1)) * (B.fever ? 1.6 : 1); }

function startFever(){
  B.fever = true;
  B.feverEnd = B.t + FEVER_MS + (hasR('yonetsu') ? 2000 : 0);
  B.stats.fevers++;
  log('百鬼夜行！ 札が全部見える！');
  $('#battle').classList.add('fever');
  banner('百鬼夜行!!');
  sfx('fever');
  shake(true);
  buzz([30, 30, 30, 30, 60]);
  for (let i = 0; i < SLOTS; i++) if (B.slots[i]) renderSlot(i);
}

/* ---------- 効果音 ----------

const NOISE = new WeakMap();
function noiseBuf(c){
  let b = NOISE.get(c);
  if (!b){
    b = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  const o = c.createOscillator(), g = env(c, t, a, d, v);

  let n = o;

function hiss(c, out, t, { f = 1000, f2, q = 1, type = 'bandpass', a = .002, d = .1, v = .3 }){
  const src = c.createBufferSource(), fl = c.createBiquadFilter(), g = env(c, t, a, d, v);
  src.buffer = noiseBuf(c);
  fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + a + d);
  src.connect(fl); fl.connect(g); g.connect(out);
  src.start(t, Math.random() * .5); src.stop(t + a + d + .05);

function sfxInit(){
  if (SFX.ctx){ if (SFX.ctx.state === 'suspended') SFX.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    SFX.ctx = new AC();
    // 効果音は控えめの音量でまとめ、BGMと一緒にコンプレッサーを通す
    const comp = SFX.ctx.createDynamicsCompressor(), g = SFX.ctx.createGain(), se = SFX.ctx.createGain();
    comp.threshold.value = -14; comp.ratio.value = 4;
    g.gain.value = .78; se.gain.value = seLevel();
    se.connect(comp); comp.connect(g); g.connect(SFX.ctx.destination);
    SFX.out = se; SFX.master = comp;
  } catch(e){ SFX.ctx = null; }
}
function sfx(name, arg){
  if (SFX.rec) SFX.rec.push([performance.now(), name, arg]);   // PV用の記録
  if (!SFX.on || !SFX.ctx) return;
  try { SND[name](SFX.ctx, SFX.out, SFX.ctx.currentTime + .005, arg); } catch(e){}
}

function bgmStep(c, o, t, i, s16, song, fever){
  const bars = song.prog.length, bar = Math.floor(i / 16) % bars, p = i % 16, last = bar === bars - 1;
  const [root, tri] = CH[song.prog[bar]];
  // ドラム
  if (p === 0 && bar % 8 === 0) bCrash(c, o, t);
  if (song.kick.includes(p) || (fever && p % 4 === 2 && song !== SONGS.night)) bKick(c, o, t, .75);
  if (last && p >= 8) bSnare(c, o, t, .15 + (p - 8) * .03);   // 一周の終わりはスネアの連打
  else if (song.snare.includes(p)) bSnare(c, o, t, .32);
  if (song.hat.includes(p)) bHat(c, o, t, song.hatV * 1.4, true);
  else if (p % 2 === 0 || fever) bHat(c, o, t, song.hatV * .7);
  // ベース：8分で根音とオクターブを刻む
  if (p % 2 === 0) bBass(c, o, t, root + ([0, 0, 12, 0, 0, 12, 0, 12][p >> 1]), s16 * 1.7);
  // 伴奏の和音（小節の頭）
  if (p === 0) bPad(c, o, t, tri, s16 * 16);
  // アルペジオ：夜道は8分、戦闘は16分。百鬼夜行中は1オクターブ上
  if (song.arp === 16 || p % 2 === 0){
    const k = song.arp === 16 ? p % 4 : (p >> 1) % 4;
    const m = [tri[0], tri[1], tri[2], tri[1]][k];
    bArp(c, o, t, m, fever ? .06 : .05);
  }
  // リード
  const ev = song.mel[i % (bars * 16)];
  if (ev) bLead(c, o, t, ev[0], ev[1] * s16, song.lead);
}
// 決着のジングル（勝ち＝短いファンファーレ、負け＝ゆっくり下がる2小節）。鳴り終わるまで次の曲は待たせる
const JINGLES = {
  win:{ bpm:160, start:.2, len:16, mel:parseMel('A5:2 C#6:2 E6:2 F#6:10'),
    ch:[[0, 'A', 6], [6, 'D', 10]], kick:[0, 6], roll:[2, 6], crash:[6] },
  lose:{ bpm:100, start:.1, len:16, mel:parseMel('E5:3 C5:3 A4:10'),
    ch:[[0, 'Dm', 6], [6, 'Am', 10]], kick:[0, 6], roll:null, crash:[] },
};
function bgmFadeOut(){
  const c = SFX.ctx, g = BGM.gain;
  if (!c || !g) return;
  g.gain.cancelScheduledValues(c.currentTime);
  g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + .35);   // 予約済みの音は消えながら鳴り終わる
  setTimeout(() => { try { g.disconnect(); } catch(e){} }, 800);
  BGM.gain = null;
}
function bgmNewGain(fadeIn){
  const c = SFX.ctx, g = c.createGain();
  g.gain.setValueAtTime(0.0001, c.currentTime);
  g.gain.exponentialRampToValueAtTime(bgmLevel(), c.currentTime + fadeIn);
  g.connect(SFX.master);
  return g;
}
function bgmMode(m){
  const c = SFX.ctx;
  // ジングルが鳴っている間は、次の戦闘以外は鳴り終わるまで待つ
  if (c && c.currentTime < BGM.holdUntil && m !== 'battle' && m !== 'boss'){ BGM.pend = m; return; }
  BGM.holdUntil = 0; BGM.pend = null;
  if (BGM.mode === m) return;
  BGM.mode = m;
  BGM.step = 0;
  if (!c) return;
  bgmFadeOut();
  if (m){ BGM.gain = bgmNewGain(.3); BGM.next = c.currentTime + .08; }
}
function bgmJingle(name){
  const c = SFX.ctx;
  BGM.mode = null; BGM.pend = null;
  if (!c) return;
  bgmFadeOut();
  if (!BGM.on || c.state !== 'running') return;
  const J = JINGLES[name], s16 = 60 / J.bpm / 4, t0 = c.currentTime + J.start, g = bgmNewGain(.01);
  BGM.gain = g;
  J.crash.forEach(p => bCrash(c, g, t0 + p * s16));
  J.kick.forEach(p => bKick(c, g, t0 + p * s16, .7));
  if (J.roll) for (let p = J.roll[0]; p < J.roll[1]; p++) bSnare(c, g, t0 + p * s16, .15 + (p - J.roll[0]) * .05);
  J.ch.forEach(([p, ch, len]) => {
    const [root, tri] = CH[ch];
    bPad(c, g, t0 + p * s16, tri, len * s16);
    bBass(c, g, t0 + p * s16, root, len * s16 * .9);
  });
  Object.entries(J.mel).forEach(([p, [m, len]]) => {
    bLead(c, g, t0 + p * s16, m, len * s16, .09);
    bLead(c, g, t0 + p * s16, m - 12, len * s16, .04);   // 1オクターブ下を重ねて厚く
  });
  BGM.holdUntil = t0 + J.len * s16 + .2;
}
function bgmTick(){
  const c = SFX.ctx;
  if (!c || !BGM.on || c.state !== 'running') return;
  if (BGM.pend && c.currentTime >= BGM.holdUntil) bgmMode(BGM.pend);   // ジングルが鳴り終わったら次の曲へ
  if (!BGM.mode) return;
  if (!BGM.gain) BGM.gain = bgmNewGain(.3);
  if (B && B.paused && BGM.mode !== 'night') { BGM.next = 0; return; }   // 一時停止中は止める
  const song = SONGS[BGM.mode], s16 = 60 / song.bpm / 4;
  if (BGM.next < c.currentTime) BGM.next = c.currentTime + .05;
  const fever = !!(B && B.fever && !B.over);
  if (fever && !BGM.fever) bCrash(c, BGM.gain, BGM.next);   // 百鬼夜行の始まりにシンバル
  BGM.fever = fever;
  while (BGM.next < c.currentTime + .2){
    try { bgmStep(c, BGM.gain, BGM.next, BGM.step, s16, song, fever); } catch(e){}
    BGM.next += s16;
    BGM.step++;
  }
}
setInterval(bgmTick, 40);
/* ---------- 音量 ----------
   BGM・効果音それぞれ 0〜100。0 で鳴らさない。最初は 80（この端末に保存）。
   以前の「あり／なし」の設定が「なし」なら 0 から始める */
const VOL_KEY = 'hyakki-mekuri.vol';
const VOL = { bgm:80, se:80 };
try {
  const v = JSON.parse(localStorage.getItem(VOL_KEY) || 'null');
  if (v) Object.assign(VOL, v);
  else { if (localStorage.getItem(SND_KEY) === 'off') VOL.se = 0; if (localStorage.getItem(BGM_KEY) === 'off') VOL.bgm = 0; }
} catch(e){}
function seLevel(){ return .75 * VOL.se / 80; }
function bgmLevel(){ return Math.max(.0001, BGM_VOL * VOL.bgm / 80); }
function applyVol(){
  SFX.on = VOL.se > 0; BGM.on = VOL.bgm > 0;
  const c = SFX.ctx;
  if (!c) return;
  if (SFX.out){ SFX.out.gain.cancelScheduledValues(c.currentTime); SFX.out.gain.setTargetAtTime(seLevel(), c.currentTime, .03); }
  if (BGM.gain){ BGM.gain.gain.cancelScheduledValues(c.currentTime); BGM.gain.gain.setTargetAtTime(bgmLevel(), c.currentTime, .05); }
}
function setVol(kind, v){
  VOL[kind] = v;
  try { localStorage.setItem(VOL_KEY, JSON.stringify(VOL)); } catch(e){}
  applyVol();
  renderVol();
}
function renderVol(){
  document.querySelectorAll('.volBgm').forEach(x => x.value = VOL.bgm);
  document.querySelectorAll('.volSe').forEach(x => x.value = VOL.se);
  document.querySelectorAll('.volBgmN').forEach(x => x.textContent = VOL.bgm);
  document.querySelectorAll('.volSeN').forEach(x => x.textContent = VOL.se);
}

function pulse(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function shake(big){ pulse($('#app'), big ? 'shake-l' : 'shake-s'); }
function appPos(el){
  const a = $('#app').getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left - a.left + r.width / 2, y: r.top - a.top + r.height / 2, w: a.width / 100 };
}
function fx(cls, x, y, style, html, life){
  const d = document.createElement('div');
  d.className = cls;
  d.style.left = x + 'px'; d.style.top = y + 'px';
  if (style) for (const k in style) d.style.setProperty(k, style[k]);
  if (html) d.innerHTML = html;
  $('#fx').appendChild(d);
  setTimeout(() => d.remove(), life || 900);
}
function floatNum(el, text, cls, big){
  const p = appPos(el);
  fx('num ' + cls + (big ? ' big' : ''), p.x + (Math.random() - .5) * p.w * 14, p.y + (Math.random() - .5) * p.w * 6, null, text);
}
// そろった瞬間：札の色の火花と光の輪。連続が伸びるほど派手に
function burst(slots, col, combo){
  const n = 6 + Math.min(combo, 12);
  slots.forEach(i => {
    const p = appPos(slotEl(i));
    fx('rg', p.x, p.y, { '--c': col }, null, 500);
    for (let k = 0; k < n; k++){
      const a = (k / n) * Math.PI * 2 + Math.random() * .4, d = p.w * (8 + Math.random() * 8 + Math.min(combo, 12));
      fx('sp', p.x, p.y, { background: k % 3 ? col : '#ece3cf', '--dx': Math.cos(a) * d + 'px', '--dy': Math.sin(a) * d + 'px' }, null, 650);
    }
  });
  pulse($('#cNum'), 'pop');
  if (combo >= 10) shake(true); else if (combo >= 4) shake(false);
  buzz(combo >= 10 ? [15, 25, 15] : 10);
}

// 札ごとの行列の妖怪（似た役割の札は同じ姿で色違い）
const YK_PX = { zan:'y_oni', ka:'y_oni', baku:'y_oni', mamo:'y_kasa', ame:'y_kasa', ren:'y_neko', kyu:'y_neko', rai:'y_neko',
  kusuri:'y_obake', sukasu:'y_obake', toki:'y_obake', kagami:'y_obake', noroi:'y_obake', zeni:'y_chochin', en:'y_chochin', fuu:'y_kappa', zen:'y_kappa' };
// ドット絵の文字列を SVG にする。a/b/c は本体の色とその暗い・明るい色
function pxMix(hex, t, to){
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255];
  return '#' + c.map(v => Math.round(v + (to - v) * t).toString(16).padStart(2, '0')).join('');
}
const PX_PAL = { k:'#1b1820', w:'#ece3cf', r:'#c4412b', y:'#c9a14a', g:'#8a8494', s:'#e0c9a6' };
function pxSVG(rows, col){
  const pal = Object.assign({}, PX_PAL, { a:col, b:pxMix(col, .35, 0), c:pxMix(col, .35, 255) });
  let out = '';
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length;){
      const ch = row[x];
      let e = x + 1; while (e < row.length && row[e] === ch) e++;
      if (ch !== '.') out += `<rect x="${x}" y="${y}" width="${e - x}" height="1" fill="${pal[ch]}"/>`;
      x = e;
    }
  });
  return `<svg viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
}
const PX_CACHE = {};
function pxArt(key, col){ const id = key + col; return PX_CACHE[id] || (PX_CACHE[id] = pxSVG(PX[key], col)); }

/* ---------- 場面（百鬼の行列） ---------- */
const PARADE_MAX = 7;
const STAGE_FX = { mamo:'barrier', kusuri:'heal', zeni:'coin' };
function ykEl(k){
  const d = document.createElement('div');
  d.className = 'yk';
  d.innerHTML = pxArt(YK_PX[k] || 'y_obake', SK[k].col);
  return d;
}
function stageXY(el){
  const a = $('#stage').getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left - a.left, y: r.top - a.top, w: r.width, h: r.height };
}
function stageFx(cls, x, y, style, life){
  const d = document.createElement('div');
  d.className = cls;
  if (x !== null){ d.style.left = x + 'px'; d.style.top = y + 'px'; }

// そろえた札の妖怪が行列に加わり、技に応じて攻撃する
// 攻撃の見せ方（行列から敵へ突っ込んで、当たった所で技ごとの演出）
const HIT_FX = { zan:'cut', ren:'jab', en:'fire', rai:'bolt', baku:'boom', ame:'rain', kyu:'drain',
                 fuu:'seal', toki:'clock', sukasu:'eye', zen:'eye', kagami:'mirror', noroi:'puff' };
function stageAct(k, hits){
  const pr = $('#parade');
  const y = ykEl(k);
  y.classList.add('new');
  pr.appendChild(y);
  while (pr.children.length > PARADE_MAX) pr.firstChild.remove();
  // 行列でかける技
  if (k === 'mamo'){ pulse($('#barrier'), 'ping'); sfx('guard'); return; }
  if (k === 'kusuri'){
    pulse(pr, 'glow'); setTimeout(() => pr.classList.remove('glow'), 500);
    const p = stageXY(pr);
    for (let i = 0; i < 6; i++) stageFx('orb', p.x + p.w * (.4 + Math.random() * .6), p.y + p.h * .8, null, 600)
      .animate([{ transform:'translateY(0)', opacity:1 }, { transform:`translateY(${-p.h}px)`, opacity:0 }], { duration:600, easing:'ease-out' });
    return;
  }
  if (k === 'zeni'){
    sfx('coin');
    const p = stageXY(y), w = $('#stage').clientWidth / 100;
    for (let i = 0; i < 5; i++) stageFx('coinfx', p.x + p.w / 2, p.y + p.h / 2, { '--dx': ((i - 2) * w * 3) + 'px' }, 620);
    return;
  }
  if (k === 'ka'){ pulse(pr, 'power'); return; }
  const fx = HIT_FX[k] || 'cut';
  if (fx === 'bolt'){
    stageFx('bolt', null, null, null, 320);
    setTimeout(() => impactAt(fx, k, hits), 90);
    return;
  }
  rush(y, k, () => impactAt(fx, k, hits));
}
// 妖怪が大きくなって跳び上がり、敵に突っ込む
function rush(fromEl, k, done){
  const st = $('#stage'), from = stageXY(fromEl), to = stageXY($('#foe'));
  const f = ykEl(k);
  f.classList.add('atk');
  f.style.left = from.x + 'px'; f.style.top = from.y + 'px';

  const an = f.animate([
    { transform:'translate(0,0) scale(1)' },
    { transform:`translate(${dx * .25}px,${up}px) scale(1.8) rotate(-18deg)`, offset:.42 },
    { transform:`translate(${dx}px,${dy}px) scale(1.5) rotate(22deg)` },
  ], { duration:330, easing:'cubic-bezier(.45,0,.85,.55)' });
  an.onfinish = () => { f.remove(); done(); };
}
// 当たった所：敵がのけぞり、ダメージ数字、技ごとの演出
function impactAt(fx, k, hits){
  const to = stageXY($('#foe')), cx = to.x + to.w / 2, cy = to.y + to.h / 2;
  const col = SK[k].col, w = $('#stage').clientWidth / 100;
  if (!$('#foe').classList.contains('dead')) pulse($('#foe'), 'hit');
  if (hits && hits.length) sfx('hit', hits.reduce((x, y) => x + y, 0));
  (hits || []).forEach((d, i) => setTimeout(() => {
    const n = stageFx('snum' + (d >= 20 ? ' big' : ''), cx + (Math.random() - .5) * w * 10, cy - w * 4 - i * w * 2, null, 720);
    n.textContent = d ? d : 'ガード';
  }, i * 70));
  switch (fx){
    case 'cut':
      [32, -32].forEach((r, i) => setTimeout(() => { const c = stageFx('cut', cx, cy, { '--c':col }, 340); c.style.transform = `rotate(${r}deg)`; }, i * 70));
      break;
    case 'jab':
      for (let i = 0; i < 3; i++) setTimeout(() => stageFx('impact', cx + (Math.random() - .5) * w * 10, cy + (Math.random() - .5) * w * 10, { '--c':col }, 320), i * 70);
      break;
    case 'fire':
      stageFx('impact', cx, cy, { '--c':'#ff8a1f' }, 320);
      for (let i = 0; i < 7; i++) stageFx('flame', cx + (Math.random() - .5) * w * 12, cy + w * 4, { '--dx': ((Math.random() - .5) * w * 8) + 'px' }, 560);
      break;
    case 'boom':
      stageFx('boom', cx, cy, null, 520); shake(true);
      break;
    case 'rain':
      for (let i = 0; i < 4; i++) setTimeout(() => {
        stageFx('needle', cx + (i - 1.5) * w * 4, cy - w * 6, null, 260);
        setTimeout(() => stageFx('impact', cx + (i - 1.5) * w * 4, cy, { '--c':'#38bdf8' }, 250), 200);
      }, i * 70);
      break;
    case 'drain': {
      stageFx('impact', cx, cy, { '--c':col }, 320);
      const p = stageXY($('#parade'));
      for (let i = 0; i < 5; i++) setTimeout(() => {
        const o = stageFx('orb', cx, cy, null, 520);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          o.style.transform = `translate(${p.x + p.w * (.5 + Math.random() * .5) - cx}px,${p.y + p.h * .6 - cy}px)`; o.style.opacity = '.3';
        }));
      }, i * 60);
      break;
    }
    case 'seal':  stageFx('seal', cx, cy, null, 760).textContent = '封'; break;
    case 'clock': stageFx('clock', cx, cy, null, 720); break;
    case 'eye':   stageFx('eyefx', cx, cy, null, 520); break;
    case 'mirror':
      stageFx('impact', cx, cy, { '--c':'#e2e8f0' }, 320);
      stageFx('cut', cx, cy, { '--c':'#fff' }, 340);
      break;
    default:
      stageFx('impact', cx, cy, { '--c':col }, 320);
  }
}

/* ---------- 技の効果 ---------- */
function hitFoe(base){
  const e = B.e;
  let d = Math.max(0, Math.round(base));
  const ab = Math.min(e.blk, d);
  e.blk -= ab; d -= ab;
  e.hp = Math.max(0, e.hp - d);
  if (B.hitLog) B.hitLog.push(d); else pulse($('#foe'), 'hit');   // やけど等はその場でのけぞる
  floatNum($('#eHpBar').parentNode, d ? d : 'ガード', 'dmg', d >= 20);
  if (e.hp <= 0) winBattle();
}
function heal(v){
  const before = run.hp;
  run.hp = Math.min(run.maxHp, run.hp + Math.round(v));
  if (B && !B.over && run.hp > before){ floatNum($('#pHpBar').parentNode, '+' + (run.hp - before), 'heal'); sfx('heal'); }
}
function applySkill(k, u, m){
  const sk = SK[k], v = sk.nv(u), str = B.p.str;
  switch (k){
    case 'zan':    hitFoe((v + str + (hasR('toishi') ? 3 : 0)) * m); break;
    case 'ren':    hitFoe((v + str) * m); break;
    case 'mamo':   B.p.blk += Math.round(v * m); floatNum($('#pHpBar').parentNode, '守+' + Math.round(v * m), 'blk'); break;
    case 'kusuri': heal(v * m); break;
    case 'zeni':   run.gold += Math.round(v * m); break;
    case 'sukasu': peekRandom(v, 1200); break;
    case 'en':     B.e.burn += Math.round(v * m); break;
    case 'toki':   B.e.timer = Math.max(0, B.e.timer - v * 1000); break;
    case 'kyu':    hitFoe((v + str) * m); heal((2 + u) * m); break;
    case 'fuu':    B.e.weak += v; break;
    case 'ka':     B.p.str += v; break;
    case 'rai':    hitFoe((v * Math.max(1, B.combo) + str) * m); break;
    case 'baku':   hitFoe((v + str) * m); hurtMe(2, true); break;
    case 'ame':    for (let h = 0; h < 4 && !B.over; h++) hitFoe((v + str) * m); break;
    case 'zen':
      B.combo += 2;
      B.slots.forEach((s, i) => { if (s && s.st === 'down'){ s.peekUntil = B.t + (u ? 1500 : 1000); renderSlot(i); } });
      break;
  }
}
function peekRandom(n, ms){
  const downs = B.slots.map((s, i) => s && s.st === 'down' ? i : -1).filter(i => i >= 0);
  B.rng.shuffle(downs).slice(0, n).forEach(i => { B.slots[i].peekUntil = B.t + ms; renderSlot(i); });
}
function hurtMe(d, pierce){
  let dmg = Math.round(d);
  if (!pierce){ const ab = Math.min(B.p.blk, dmg); B.p.blk -= ab; dmg -= ab; }
  run.hp = Math.max(0, run.hp - dmg);
  if (dmg > 0){
    floatNum($('#pHpBar').parentNode, '-' + dmg, 'hurt', dmg >= 12);
    pulse($('#hurtfx'), 'on');
    if (dmg >= 8) shake(true);
    buzz(40);
    sfx('hurt');
  }
  if (run.hp <= 0 && B.fuku){ B.fuku = false; run.hp = 1; log('不屈！ HP1で踏みとどまった'); }
  if (run.hp <= 0) loseBattle();
  return dmg;
}

/* ---------- 敵の行動 ---------- */
function curIntent(){ return B.f.it[B.e.step % B.f.it.length]; }
function foeAct(){
  const [t, v, n] = curIntent(), e = B.e;
  const fe = $('#foe'); fe.classList.remove('act'); void fe.offsetWidth; fe.classList.add('act');
  if (t === 'atk'){
    const d = (v + e.str) * e.atkMul * (e.weak > 0 ? 0.6 : 1);
    let got = 0;
    for (let h = 0; h < (n || 1) && !B.over; h++) got += hurtMe(d);
    stageHit(got);
    if (!got) sfx('guard');
    log(got ? `${B.f.n}の攻撃！ ${got} ダメージ` : `${B.f.n}の攻撃を防いだ！`);
  } else if (t === 'def'){ e.blk += v; log(`${B.f.n}は身を守った`); }
  if (t !== 'atk') sfx('foe');
  else if (t === 'buff'){ e.str += v; log(`${B.f.n}の力が上がった`); }
  else if (t === 'curse'){
    for (let n = 0; n < v * 2; n++) B.pile.splice(B.rng.int(B.pile.length + 1), 0, { id:B.uid++, k:'noroi', u:0 });
    log('呪いの札が山札に混ぜられた！');
  } else if (t === 'freeze'){
    const downs = B.slots.map((s, i) => s && s.st === 'down' ? i : -1).filter(i => i >= 0);
    B.rng.shuffle(downs).slice(0, v).forEach(i => { B.slots[i].frozenUntil = B.t + 4500; renderSlot(i); });
    log('札が凍らされた！');
  } else if (t === 'shuffle'){
    const idx = B.slots.map((s, i) => s && s.st === 'down' ? i : -1).filter(i => i >= 0);
    const cs = B.rng.shuffle(idx.map(i => B.slots[i]));
    idx.forEach((i, k) => { B.slots[i] = cs[k]; renderSlot(i); });
    const bd = $('#board'); bd.classList.remove('stir'); void bd.offsetWidth; bd.classList.add('stir');
    log('札がかき混ぜられた！');
  }
  if (e.weak > 0) e.weak--;
  B.p.blk = hasR('teppeki') ? Math.floor(B.p.blk / 2) : 0;  // 防御は敵の行動ごとに消える
  e.step++;
}

/* ---------- ループ ---------- */
function loop(now){
  if (!B || B.over) return;
  const dt = Math.min(60, now - B.last);
  B.last = now;
  if (!B.paused) update(dt * DEBUG.speed);
  requestAnimationFrame(loop);
}
function update(dt){
  B.t += dt;
  const e = B.e;
  // 開いた札の時間切れ
  for (const i of openSlots()) if (B.t - B.slots[i].at > openMs()) closeSlot(i, true);
  // コンボの時間切れ
  if (B.combo > 0 && B.t - B.lastMatch > COMBO_MS) comboBreak();
  // 百鬼夜行中の大行列
  if (B.fever && B.t - (B.lastRun || 0) > 140){ B.lastRun = B.t; spawnRunner(); }
  // 百鬼夜行の終了
  if (B.fever && B.t > B.feverEnd){ B.fever = false; $('#battle').classList.remove('fever'); for (let i = 0; i < SLOTS; i++) if (B.slots[i]) renderSlot(i); }
  // 透かし・凍結の終了
  B.slots.forEach((s, i) => {
    if (!s) return;
    if (s.peekUntil && s.peekUntil <= B.t){ s.peekUntil = 0; renderSlot(i); }
    if (s.frozenUntil && s.frozenUntil <= B.t){ s.frozenUntil = 0; renderSlot(i); }
  });
  // 補充
  B.queue = B.queue.filter(q => {
    if (q.at > B.t) return true;
    if (!B.slots[q.slot]){ dealTo(q.slot, true); renderSlot(q.slot); }
    return false;
  });
  if (!B.queue.length) checkStuck();
  // やけど
  if (e.burn > 0){
    B.burnAcc += dt;
    if (B.burnAcc >= 1000){ B.burnAcc -= 1000; hitFoe(e.burn); e.burn--; if (B.over) return; }
  }
  // 敵のタイマー
  e.timer += dt;
  if (e.timer >= e.iv){ e.timer = 0; foeAct(); if (B.over) return; }
  if (B.t - (B.lastSnap || 0) > SNAP_MS) snapBattle();
  renderStatus();
}

// そろえられる組が盤に無ければ伏せ札を山に戻して配り直す
function checkStuck(){
  const live = B.slots.filter(s => s && (s.st === 'down' || s.st === 'open'));
  if (live.length < 2) { if (!B.pile.length && !B.disc.length) return; }
  const cnt = {};
  let mirror = 0;
  live.forEach(s => { if (s.c.k === 'kagami') mirror++; cnt[s.c.k] = (cnt[s.c.k] || 0) + 1; });
  const ok = mirror > 0 && live.length >= 2 || Object.values(cnt).some(n => n >= 2);
  if (ok) return;
  B.slots.forEach((s, i) => {
    if (s && s.st === 'down'){ B.pile.unshift(s.c); B.slots[i] = null; }
  });
  B.rng.shuffle(B.pile);
  for (let i = 0; i < SLOTS; i++) if (!B.slots[i]){ dealTo(i); }
  for (let i = 0; i < SLOTS; i++) renderSlot(i);
  log('そろう札が無いので配り直した');
}

/* ---------- 表示 ---------- */
function renderStatus(){
  const e = B.e;
  $('#eHpBar').style.width = (e.hp / e.max * 100) + '%';
  $('#eHp').innerHTML = `${e.hp}<small>/${e.max}</small>`;
  const [t, v, n] = curIntent();
  const ic = $('#eIntent');
  const atk = Math.round((v + e.str) * e.atkMul * (e.weak > 0 ? 0.6 : 1));
  ic.className = 'ic ' + (t === 'atk' ? 'atk' : t === 'def' ? 'def' : 'special');
  ic.textContent = t === 'atk' ? `攻撃 ${atk}${n > 1 ? '×' + n : ''}` : t === 'shuffle' ? 'かき混ぜ' : t === 'def' ? `防御 ${v}` : t === 'buff' ? '力をためる' : t === 'curse' ? '呪い' : t === 'freeze' ? '凍結' : '';

/* ---------- 日本語の改行 ----------
   iPhone のブラウザは日本語を文節で改行できないので、改行してよい所に <wbr> を入れる。
   CSS で keep-all にしているので、目印の無い所では改行しない（「1」「つ）」のような泣き別れを防ぐ）。
   目印：句読点・閉じ括弧の後、開き括弧の前、ひらがな→漢字・カタカナ・数字に切り替わる所。 */
const JP_OPEN = '（「『【〔(', JP_CLOSE = '、。，．！？!?）」』】〕)…／';
const JP_HIRA = /[\u3041-\u309F]/, JP_WORD = /[\u30A0-\u30FF\u4E00-\u9FFF0-9０-９A-Za-zＡ-Ｚ＋+×]/;
// ひらがなを含む言葉で、途中で切りたくないもの
const JP_KEEP = ['お守り', 'その場', '形の紋', '幕の主', '落とし物', '伏せ札', '捨て札', 'かき混ぜ', '見せる', 'つづきから', 'あらわれた', '祓った', 'ため込', '立ち去る'];
const JP_BRACKET_CLOSE = '」』）)】〕';
function jpBreaks(t){
  const keep = new Array(t.length).fill(false);
  JP_KEEP.forEach(w => { let i = -1; while ((i = t.indexOf(w, i + 1)) >= 0) for (let k = i; k < i + w.length - 1; k++) keep[k] = true; });
  const cuts = [];
  for (let i = 0; i < t.length - 1; i++){
    const c = t[i], n = t[i + 1];
    if (keep[i] || JP_CLOSE.includes(n) || c === ' ' || n === ' ' || c === '　') continue;
    if (JP_BRACKET_CLOSE.includes(c) && JP_HIRA.test(n)) continue;                 // 「…」で｜ のように助詞の後ろで切る
    if ((c === 'お' || c === 'ご') && (i === 0 || !JP_HIRA.test(t[i - 1]))) continue;  // 言葉の頭の「お・ご」の後では切らない
    if (JP_CLOSE.includes(c) || (JP_OPEN.includes(n) && !JP_OPEN.includes(c)) || (JP_HIRA.test(c) && JP_WORD.test(n))) cuts.push(i);
  }
  return cuts;
}
function wrapJP(root){
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(tn => {
    const t = tn.nodeValue, cuts = t.length > 4 ? jpBreaks(t) : [];
    if (!cuts.length) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    cuts.forEach(i => { frag.append(t.slice(last, i + 1), document.createElement('wbr')); last = i + 1; });
    frag.append(t.slice(last));
    tn.replaceWith(frag);
  });
}

/* ---------- 報酬の札 ---------- */
// kind: fight / elite / boss / shop
function rollRarity(r, kind){
  const x = r.next();
  const [rare, unc] = kind === 'boss' ? [.5, .9] : kind === 'elite' ? [.15, .55] : kind === 'shop' ? [.12, .45] : [.07, .37];
  return x < rare ? 2 : x < unc ? 1 : 0;
}
function cardChoices(n, kind){
  const { r, done } = rrng();
  const out = [];
  while (out.length < n){
    const rar = rollRarity(r, kind);
    const cand = POOL.filter(k => SK[k].r === rar && !out.includes(k));
    if (cand.length) out.push(r.pick(cand));
  }
  done();
  return out;
}
function cardPickHTML(k, u, cnt){
  const sk = SK[k];
  return `<div class="mini" style="--k:${sk.col}">${monSVG(k)}<span class="mk">${sk.n}</span>${cnt ? `<span class="x2">${cnt}組</span>` : ''}</div>`
       + `<div><div class="nm">${sk.n}${u ? '＋' : ''}　<small>${RAR_NAME[sk.r] || ''}</small></div><div class="ds">${sk.d(u)}</div></div>`;
}

// 強化の見本：変わる数字を「6→9」のように出す（文の形が変わる札は「いま／強化後」の2行）
function upgradeDiff(k){
  const sk = SK[k], a = sk.d(0).split(/(\d+(?:\.\d+)?)/), b = sk.d(1).split(/(\d+(?:\.\d+)?)/);
  if (a.length === b.length && a.every((x, i) => i % 2 || x === b[i]))
    return a.map((x, i) => i % 2 && x !== b[i] ? `<span class="ug">${x}→<em>${b[i]}</em></span>` : (i % 2 ? x : b[i])).join('');
  return `いま：${sk.d(0)}<br>強化後：<em>${sk.d(1)}</em>`;
}
function upgradePickHTML(k, cnt){
  const sk = SK[k];
  return `<div class="mini" style="--k:${sk.col}">${monSVG(k)}<span class="mk">${sk.n}</span>${cnt ? `<span class="x2">${cnt}組</span>` : ''}</div>`
       + `<div><div class="nm">${sk.n} → ${sk.n}＋　<small>${RAR_NAME[sk.r] || ''}</small></div><div class="ds">${upgradeDiff(k)}</div></div>`;
}

/* ---------- マップ ---------- */
const MAP_ROWS = 7, MAP_COLS = 4;
const NODE = {
  fight:   { e:'戦', n:'戦闘' },
  elite:   { e:'強', n:'強敵' },
  rest:    { e:'休', n:'休憩' },
  shop:    { e:'店', n:'店' },
  event:   { e:'？', n:'できごと' },
  treasure:{ e:'宝', n:'宝箱' },
  boss:    { e:'主', n:'幕の主' },
};
function genMap(act){
  const r = makeRng(hashStr(run.seed + '|map|' + act));
  const nodes = {}, edges = new Set();
  const key = (row, col) => row * 10 + col;
  const starts = r.shuffle([0, 1, 2, 3]);
  for (let p = 0; p < 4; p++){
    let col = p < 2 ? starts[p] : r.int(MAP_COLS);
    for (let row = 0; row < MAP_ROWS; row++){
      nodes[key(row, col)] = { id:key(row, col), row, col };
      if (row < MAP_ROWS - 1){
        const nc = Math.max(0, Math.min(MAP_COLS - 1, col + r.int(3) - 1));
        edges.add(key(row, col) + '-' + key(row + 1, nc));
        col = nc;
      }
    }
  }
  Object.values(nodes).forEach(n => {
    if (n.row === 0) n.type = 'fight';
    else if (n.row === 3) n.type = 'treasure';
    else if (n.row === MAP_ROWS - 1) n.type = 'rest';
    else {
      const bag = [['fight', 48], ['event', 22], ['shop', 10]];
      if (n.row >= 2) bag.push(['elite', 14]);
      if (n.row >= 2 && n.row !== MAP_ROWS - 2) bag.push(['rest', 8]);
      let x = r.next() * bag.reduce((s, b) => s + b[1], 0);
      n.type = bag.find(b => (x -= b[1]) < 0)[0];
    }
  });
  const BOSS = 99;
  nodes[BOSS] = { id:BOSS, row:MAP_ROWS, col:1.5, type:'boss' };
  Object.values(nodes).filter(n => n.row === MAP_ROWS - 1).forEach(n => edges.add(n.id + '-' + BOSS));
  return { nodes, edges:[...edges].map(e => e.split('-').map(Number)) };
}
function nextNodes(){
  const m = run.map;
  if (run.at < 0) return Object.values(m.nodes).filter(n => n.row === 0).map(n => n.id);
  return m.edges.filter(e => e[0] === run.at).map(e => e[1]);
}

function enterMap(){
  B = null;
  show('map');
  renderMapHead();
  const box = $('#mapBox'), svg = $('#mapSvg');
  const m = run.map, nexts = nextNodes();
  const W = box.clientWidth, rowH = W * 0.24, H = rowH * (MAP_ROWS + 1) + W * 0.2;
  box.style.height = H + 'px';
  const pos = n => ({ x: W * (0.14 + n.col * 0.24), y: H - W * 0.12 - n.row * rowH });
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.innerHTML = m.edges.map(([a, b]) => {
    const p = pos(m.nodes[a]), q = pos(m.nodes[b]);
    const on = run.path.includes(a) && run.path.includes(b);
    return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" class="${on ? 'walked' : ''}"/>`;
  }).join('');
  box.querySelectorAll('.node').forEach(e => e.remove());
  Object.values(m.nodes).forEach(n => {
    const p = pos(n), el = document.createElement('button');
    const can = nexts.includes(n.id), done = run.path.includes(n.id);
    el.className = `node t-${n.type}${can ? ' can' : ''}${done ? ' done' : ''}${n.id === run.at ? ' here' : ''}`;
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    el.textContent = NODE[n.type].e;
    el.addEventListener('click', () => { if (can) enterNode(n); else toast(NODE[n.type].n); });
    box.appendChild(el);
  });
  // 次に行ける所が見えるようにスクロール
  const sc = $('#mapScroll');
  const tgt = nexts.length ? pos(m.nodes[nexts[0]]).y : H;
  sc.scrollTop = Math.max(0, tgt - sc.clientHeight * 0.7);
  save();
}
function renderMapHead(){
